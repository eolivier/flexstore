<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      The order of the CSS layers of Vuetify, declared before any style: the first layer a browser meets is the
      lowest one. In the pre-rendered pages, the styles written in the page come in another order (the utilities
      before the core), and the reset of the buttons (color: inherit) then wins over the color of a primary
      button, which gets a dark text on its dark background.
    -->
    <style>
      @layer vuetify-core, vuetify-components, vuetify-overrides, vuetify-utilities, vuetify-final;
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F2A44" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Flexstore est une boutique en ligne de démonstration : vêtements, électronique et accessoires."
    />
    <title>Flexstore</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
