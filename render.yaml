services:
  - type: web
    name: flexstore-back
    env: docker
    plan: free
    repo: https://github.com/eolivier/flexstore
    branch: main
    dockerContext: .
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: FLEXSTORE_DATABASE_URL
        fromDatabase:
          name: flexstore-db
          property: connectionString
      # Secret used to sign the authentication tokens (JWT)
      - key: FLEXSTORE_JWT_SECRET
        generateValue: true

databases:
  - name: flexstore-db
    databaseName: flexstore
    plan: free
