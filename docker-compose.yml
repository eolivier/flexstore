services:
  db:
    image: postgres:16
    container_name: flexstore-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  flyway:
    image: flyway/flyway:10.20.0
    container_name: flexstore-flyway
    depends_on:
      db:
        condition: service_healthy
    # Flyway s’exécute puis s’arrête (parfait pour CI ou démarrage local)
    command: >
      -url=jdbc:postgresql://db:5432/${POSTGRES_DB}
      -user=${POSTGRES_USER}
      -password=${POSTGRES_PASSWORD}
      -connectRetries=60
      -locations=filesystem:/flyway/sql
      migrate
    volumes:
      # Monte tes migrations SQL (adapter le chemin si différent)
      - ./backend/migrations/src/main/resources/db/migration:/flyway/sql:ro
    environment:
      FLYWAY_BASELINE_ON_MIGRATE: "true"   # pratique si la BDD existe déjà
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: flexstore-app:latest
    container_name: flexstore-app
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      FLEXSTORE_DATABASE_URL: postgresql://${POSTGRES_USER:-flex}:${POSTGRES_PASSWORD:-flex}@db:5432/${POSTGRES_DB:-flexstore}
      # Secret de signature des JWT (au moins 32 caractères) : à changer hors développement
      FLEXSTORE_JWT_SECRET: ${FLEXSTORE_JWT_SECRET:-local-docker-secret-change-me-0123456789}
      # Emails sent to Mailpit (web interface on http://localhost:8025): no authentication nor STARTTLS
      FLEXSTORE_MAIL_HOST: mailpit
      FLEXSTORE_MAIL_PORT: 1025
      FLEXSTORE_MAIL_SMTP_AUTH: "false"
      FLEXSTORE_MAIL_SMTP_STARTTLS: "false"
    ports:
      - "8080:8080"

  # Local SMTP server that catches the emails (order confirmations): web interface on http://localhost:8025
  # Back end run outside Docker: FLEXSTORE_MAIL_HOST=localhost FLEXSTORE_MAIL_PORT=1025 FLEXSTORE_MAIL_SMTP_AUTH=false FLEXSTORE_MAIL_SMTP_STARTTLS=false
  mailpit:
    image: axllent/mailpit:v1.20.0
    container_name: flexstore-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  integrationTests:
    image: gradle:8.10-jdk21
    container_name: flexstore-integration-tests
    working_dir: /src/backend
    volumes:
      - .:/src                       # le code complet
    env_file:
      - ./.env                       # 👈 charge ton .env racine
    environment:
      SPRING_PROFILES_ACTIVE: test   # profil Spring "test"
      # Dans le conteneur, la base est joignable par le nom du service et non par localhost
      FLEXSTORE_DATABASE_URL: postgresql://${POSTGRES_USER:-flex}:${POSTGRES_PASSWORD:-flex}@db:5432/${POSTGRES_DB:-flexstore}
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    command: ./gradlew integrationTest --no-daemon
    # 👇 pour que les logs s’affichent clairement
    tty: true
    stdin_open: true
volumes:
  pgdata:
