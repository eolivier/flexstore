# src/main/resources/application.yml
spring:
  datasource:
    url:  jdbc:postgresql://${FLEXSTORE_DATASOURCE_HOST}${FLEXSTORE_DATASOURCE_HOST_SUFFIX}:${FLEXSTORE_DATASOURCE_PORT}/${FLEXSTORE_DATASOURCE_DATABASE}
    username: ${FLEXSTORE_DATASOURCE_USERNAME}
    password: ${FLEXSTORE_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
  # SMTP server of the order confirmation emails. Without host (FLEXSTORE_MAIL_HOST empty), the emails are
  # written to the logs instead of being sent
  mail:
    host: ${FLEXSTORE_MAIL_HOST:}
    port: ${FLEXSTORE_MAIL_PORT:587}
    username: ${FLEXSTORE_MAIL_USERNAME:}
    password: ${FLEXSTORE_MAIL_PASSWORD:}
    properties:
      # Most providers require authentication and STARTTLS; set both to false for a local server such as Mailpit
      mail.smtp.auth: ${FLEXSTORE_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${FLEXSTORE_MAIL_SMTP_STARTTLS:true}
  servlet:
    multipart:
      # The images of the products are 2 MB at most (checked again by the domain)
      max-file-size: 2MB
      max-request-size: 3MB
flexstore:
  mail:
    from: ${FLEXSTORE_MAIL_FROM:Flexstore <no-reply@flexstore.com>}
  # The shop that sells, as written on its invoices
  seller:
    name: ${FLEXSTORE_SELLER_NAME:Flexstore SAS}
    address: ${FLEXSTORE_SELLER_ADDRESS:1 rue de la Démo, 75001 Paris, France}
    siret: ${FLEXSTORE_SELLER_SIRET:123 456 789 00012}
    vat-number: ${FLEXSTORE_SELLER_VAT_NUMBER:FR12345678901}
  # Address of the shop, for the links of the emails and the return from the payment
  front-url: ${FLEXSTORE_FRONT_URL:http://localhost:5173}
  payment:
    # Stripe Checkout (test or live keys); without a secret key, the payments are simulated (confirmed at once)
    stripe:
      secret-key: ${FLEXSTORE_STRIPE_SECRET_KEY:}
      # Secret of the webhook endpoint /api/payments/stripe/webhook (whsec_...), to verify the notifications
      webhook-secret: ${FLEXSTORE_STRIPE_WEBHOOK_SECRET:}
  security:
    # Secret used to sign the JWT (at least 32 characters); a random one is used when missing
    jwt-secret: ${FLEXSTORE_JWT_SECRET:}
    jwt-ttl: 1h
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    # The SMTP server does not decide whether the application is up: the host (Render) checks the health and would
    # restart it. Without server the emails are written to the logs, and an email that fails does not stop an order
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: flexstore
      region: local
  observations:
    key-values:
      service: flexstore
server:
  # Behind the Render proxy (TLS ends there): trust X-Forwarded-* so that requests are seen as HTTPS
  forward-headers-strategy: framework
# (optionnel) séparer le management path/port
# port: 8080
# management.server.port: 8081
