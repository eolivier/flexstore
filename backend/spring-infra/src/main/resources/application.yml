# src/main/resources/application.yml
spring:
  datasource:
    url:  jdbc:postgresql://${FLEXSTORE_DATASOURCE_HOST}${FLEXSTORE_DATASOURCE_HOST_SUFFIX}:${FLEXSTORE_DATASOURCE_PORT}/${FLEXSTORE_DATASOURCE_DATABASE}
    username: ${FLEXSTORE_DATASOURCE_USERNAME}
    password: ${FLEXSTORE_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
flexstore:
  # The order confirmation emails are sent with SMTP when SPRING_MAIL_HOST is set (and SPRING_MAIL_PORT,
  # SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD...), and written to the logs otherwise
  mail:
    from: ${FLEXSTORE_MAIL_FROM:Flexstore <no-reply@flexstore.com>}
  # Address of the shop, for the links of the emails
  front-url: ${FLEXSTORE_FRONT_URL:http://localhost:5173}
  security:
    # Secret used to sign the JWT (at least 32 characters); a random one is used when missing
    jwt-secret: ${FLEXSTORE_JWT_SECRET:}
    jwt-ttl: 1h
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: flexstore
      region: local
  observations:
    key-values:
      service: flexstore
server:
  # Behind the Render proxy (TLS ends there): trust X-Forwarded-* so that requests are seen as HTTPS
  forward-headers-strategy: framework
# (optionnel) séparer le management path/port
# port: 8080
# management.server.port: 8081
