      properties:
        sku:
          type: string
          description: "Stock Keeping Unit, unique in the catalog: upper-case letters and digits in groups separated
            by hyphens, 32 characters at most (TSHIRT-ORGANIC-M); the spaces around are dropped, the letters put in
            upper case"
        category:
          type: string
        price:
          type: number
        currency:
          type: string
          description: Currency code (EUR)
        translations:
          type: array
          description: Every translation of the product, the default one (en) required; a translation not given is removed
          items:
