        itemId:
          type: string
        productId:
          type: string
        productName:
          type: string
        productDescription:
          type: string
        productCategory:
          type: string
        productPrice:
          type: number
        productCurrency:
          type: string
        productQuantity:
          type: integer
          format: int32
    JsonCartItem:
      type: object
      properties:
        itemId:
          type: string
        productId:
          type: string
        productName:
          type: string
        productDescription:
          type: string
        productCategory:
          type: string
        productPrice:
          type: number
          description: The price to pay for one product, the promotion included
        productCurrency:
          type: string
        productQuantity:
          type: integer
          format: int32
        itemPrice:
          type: number
        regularPrice:
          type: number
          description: The price of one product without the promotion. Shown struck through when the product is on promotion
        promotionPercentage:
          type: number
          nullable: true
          description: The percentage off the regular price while a promotion is running, null otherwise
    JsonOrderRefund:
      type: object
      required: [currentStatus]
      properties:
        currentStatus:
          type: string
          description: The status of the order as the administrator sees it (PAID or PROCESSING)
    JsonAdminOrder:
      description: An order as the administrators see it, with the customer who placed it
      allOf:
      - $ref: "#/components/schemas/JsonOrder"
      - type: object
        required: [customer, statusHistory]
        properties:
          customer:
            $ref: "#/components/schemas/JsonOrderCustomer"
          statusHistory:
            type: array
            description: The statuses the order went through, oldest first (the first one, when it was placed)
            items:
              $ref: "#/components/schemas/JsonOrderStatusChange"
    JsonOrderStatusChange:
      type: object
      required: [status, changedAt]
      properties:
        status:
          type: string
          enum: [AWAITING_PAYMENT, PAID, PROCESSING, SHIPPED, DELIVERED, CANCELLED, REFUNDED]
        changedAt:
          type: string
          format: date-time
    JsonOrderCustomer:
      type: object
      description: The customer who placed an order; empty fields when their account cannot be read any more
      required: [firstName, lastName, email]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
    JsonOrder:
      type: object
      required: [id, placedAt, status, lines, itemsPrice, shippingMethod, shippingCost, discountAmount, totalPrice,
        currency, deliveryAddress, billingAddress]
      properties:
        id:
          type: string
        placedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [AWAITING_PAYMENT, PAID, PROCESSING, SHIPPED, DELIVERED, CANCELLED, REFUNDED]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/JsonOrderLine"
        itemsPrice:
          type: number
          description: The price of the lines, without the shipping
        shippingMethod:
          type: string
          enum: [STANDARD, EXPRESS]
        shippingCost:
          type: number
          description: 0 when the shipping is free
        discountCode:
          type: string
          nullable: true
          description: The discount code used, if any
        discountAmount:
          type: number
          description: What the discount code took off the items (0 without code)
        totalPrice:
          type: number
          description: The price of the lines, less the discount, plus the shipping
        currency:
          type: string
        deliveryAddress:
          $ref: "#/components/schemas/JsonPostalAddress"
        billingAddress:
          $ref: "#/components/schemas/JsonPostalAddress"
        paymentDeadline:
          type: string
          format: date-time
          nullable: true
          description: When the order must be paid by, or it is cancelled. Only for the customer, while the order awaits its payment
