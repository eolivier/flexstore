        vatRate:
          type: string
          enum: [STANDARD, INTERMEDIATE, REDUCED, SUPER_REDUCED]
          description: "The rate of VAT included in the price: 20, 10, 5.5 or 2.1 %. STANDARD when not given"
        promotion:
          $ref: "#/components/schemas/JsonPromotion"
    JsonProduct:
      type: object
