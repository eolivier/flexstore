            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Not signed in
        "404":
          description: No such order of the customer, or the order is not paid (no invoice)
  /api/admin/orders/{id}/invoice:
    get:
      tags:
      - Invoices
      summary: Download the invoice of any paid order (PDF, ADMIN role)
      operationId: getAnyInvoice
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The invoice
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          description: Not an administrator
        "404":
          description: No such order, or the order is not paid (no invoice)
  /api/orders/{id}/credit-note:
    get:
      tags:
      - Invoices
      summary: Download the credit note of a refunded order of the signed-in customer (PDF)
      description: The credit note cancels the invoice of the order; it is issued when the order is refunded
      operationId: getCreditNote
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The credit note, saved as avoir-<number of the order>.pdf
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Not signed in
        "404":
          description: No such order of the customer, or the order is not refunded (no credit note)
  /api/admin/orders/{id}/credit-note:
    get:
      tags:
      - Invoices
      summary: Download the credit note of any refunded order (PDF, ADMIN role)
      operationId: getAnyCreditNote
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The credit note
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          description: Not an administrator
        "404":
          description: No such order, or the order is not refunded (no credit note)
  /api/admin/seller:
    get:
      tags:
      - Administration
      summary: Retrieve the seller written on the next invoices (ADMIN role)
      operationId: getSeller
      security:
      - bearerAuth: []
      responses:
        "200":
          description: The current seller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSeller"
        "403":
          description: Not an administrator
    put:
      tags:
      - Administration
      summary: Change the seller written on the next invoices; the invoices issued keep theirs (ADMIN role)
      operationId: updateSeller
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonSeller"
      responses:
        "200":
          description: The seller, now current
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSeller"
        "400":
          description: A name or an address missing, a SIRET or a VAT number malformed
        "403":
          description: Not an administrator
  /api/admin/seller/setup:
    put:
      tags:
      - Administration
      summary: Finish the setup assistant of the shop - save the seller, then turn the seller setup of the settings on (ADMIN role)
      operationId: completeSellerSetup
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonSeller"
      responses:
        "200":
          description: The seller, now current; the seller setup of the shop settings is on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSeller"
        "400":
          description: A name or an address missing, a SIRET or a VAT number malformed; the setup stays to be done
        "403":
          description: Not an administrator
  /api/social-networks:
    get:
      tags:
      - Seller
      summary: Retrieve the accounts of the shop on the social networks; empty where it has none (public)
      operationId: getSocialNetworks
      responses:
        "200":
          description: The accounts of the shop on the social networks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSocialNetworks"
  /api/legal-pages/{kind}:
    get:
      tags:
      - Legal pages
      summary: Retrieve the current version of a legal page
      operationId: getLegalPage
      parameters:
      - $ref: "#/components/parameters/LegalPageKindPath"
      responses:
        "200":
          description: The current version of the page; its text is empty until the administrators write it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonLegalPage"
        "404":
          description: No such legal page
  /api/admin/legal-pages/{kind}:
    put:
      tags:
      - Administration
      summary: Publish a new version of a legal page; the versions before are kept (ADMIN role)
      operationId: publishLegalPage
      security:
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/LegalPageKindPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonLegalText"
      responses:
        "200":
          description: The page, now current
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonLegalPage"
        "400":
          description: An empty text, or a text of more than 50 000 characters
        "403":
          description: Not an administrator
        "404":
          description: No such legal page
  /api/orders/discount-preview:
    get:
      tags:
      - Orders
      summary: Retrieve what a discount code takes off the cart of the signed-in customer
      operationId: previewDiscount
      security:
      - bearerAuth: []
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The amount the code takes off the items of the cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonDiscountPreview"
        "404":
          description: Unknown discount code
        "410":
          description: The discount code has expired, or is used up
  /api/admin/sales-dashboard:
    get:
      tags:
      - Administration
      summary: Retrieve the revenue, the orders per day and the best sellers of the last 7, 30 or 90 days (ADMIN role)
      operationId: getSalesDashboard
      security:
      - bearerAuth: []
      parameters:
      - name: days
        in: query
        required: false
        description: The number of days, the day of the request included (7, 30 or 90)
        schema:
          type: integer
          default: 30
      responses:
        "200":
          description: The sales of the period; only the paid orders count (not the cancelled nor the refunded ones)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSalesDashboard"
        "400":
          description: A number of days other than 7, 30 or 90
  /api/admin/reviews/{id}:
    delete:
      tags:
      - Administration
      summary: Delete a review; the rating of its product no longer counts it (ADMIN role)
      operationId: deleteReview
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The review is deleted
        "404":
          description: Unknown review
  /api/admin/discount-codes:
    get:
      tags:
      - Administration
      summary: Retrieve the discount codes, newest first (ADMIN role)
      operationId: getDiscountCodes
      security:
      - bearerAuth: []
      responses:
        "200":
          description: The discount codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonDiscountCode"
    post:
      tags:
      - Administration
      summary: Give a discount code (ADMIN role)
      operationId: createDiscountCode
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonNewDiscountCode"
      responses:
        "201":
          description: The discount code given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonDiscountCode"
        "400":
          description: Invalid code, reduction or usage limit
        "409":
          description: The code is already given
  /api/admin/discount-codes/{code}:
    delete:
      tags:
      - Administration
      summary: Delete a discount code; the orders that used it keep their discount (ADMIN role)
      operationId: deleteDiscountCode
      security:
      - bearerAuth: []
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Unknown discount code
  /api/orders/shipping-options:
    get:
      tags:
      - Orders
      summary: Retrieve the shipping methods, with their cost for the cart of the signed-in customer
      operationId: getShippingOptions
      security:
      - bearerAuth: []
      responses:
        "200":
          description: The shipping methods and their cost
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonShippingOptions"
        "401":
          description: Not signed in
  /api/orders:
    post:
      tags:
      - Orders
      summary: Place an order from the cart of the signed-in customer; it awaits its payment
      description: >
        The order is delivered and billed to the given addresses (the delivery address when no billing address
        is given), which become addresses of the customer when they are new. The customer accepts the current
        version of the terms of sale (its id, read from GET /api/legal-pages/terms-of-sale), kept by the order.
        The cart is kept until the order is paid (POST /api/orders/{id}/payment)
      operationId: placeOrder
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonOrderAddresses"
        required: true
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonOrder"
        "401":
          description: Not signed in
        "400":
          description: >
            Incomplete delivery or billing address (reason INCOMPLETE_ADDRESS), or terms of sale not accepted
            (reason TERMS_OF_SALE_NOT_ACCEPTED)
        "409":
          description: >
            Not enough units in stock for a product of the cart, or terms of sale published again since they
            were accepted (reason OUTDATED_TERMS_OF_SALE): the customer reads them again
        "403":
          description: "The account is SUSPENDED, LOCKED or DISABLED: { error, status }"
        "422":
          description: The cart is empty
    get:
      tags:
      - Orders
      summary: Retrieve a page of the orders of the signed-in customer, newest first
      description: The total number of orders is in the header X-Total-Count; a size above 100 is brought back
        to 100
      operationId: getOrders
      security:
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of the orders
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonOrder"
  /api/orders/{id}:
    get:
      tags:
      - Orders
      summary: Retrieve an order of the signed-in customer
      operationId: getOrder
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonOrder"
        "404":
          description: No order with this id for the signed-in customer
  /api/orders/{id}/payment:
    post:
      tags:
      - Payments
      summary: Start the payment of an order of the signed-in customer, then open its checkout page
      description: >
        With Stripe, the customer pays on the checkout page of Stripe, which confirms the payment later with its
        webhook (outcome PENDING). Without a Stripe key, the payment is simulated and confirmed at once (outcome
        PAID). Once paid, the cart is emptied and the order confirmed to the customer by email
      operationId: payOrder
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "201":
          description: The payment is started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonPaymentSession"
        "404":
          description: No order with this id for the signed-in customer
        "409":
          description: The order is already paid
  /api/payments/stripe/webhook:
    post:
      tags:
      - Payments
      summary: "Notification of Stripe: a checkout session is completed (called by Stripe, not by the front)"
      description: Authenticated by its Stripe-Signature header, verified with the secret of the webhook
      operationId: stripeNotification
      parameters:
      - name: Stripe-Signature
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Notification handled
        "400":
          description: Invalid signature
        "404":
          description: No Stripe key configured (simulated payments)
  /api/product-images:
    get:
      tags:
      - Product images
      summary: Retrieve the ids of the products that have an image
      operationId: getProductsWithImage
      responses:
        "200":
          description: The ids of the products with an image
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/products/{productId}/image:
    get:
      tags:
      - Product images
      summary: Retrieve the image of a product, in the small (cards, cart) or large (page) format
      description: A JPEG, with an ETag; the browser asks again with If-None-Match and gets 304 when unchanged
      operationId: getProductImage
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum: [small, large]
          default: large
      responses:
        "200":
          description: The image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The image did not change
        "404":
          description: The product has no image
  /api/admin/products/{productId}/image:
    put:
      tags:
      - Product images
      summary: Give the image of a product, 2 MB at most (JPEG, PNG or WebP), kept resized (ADMIN role)
      description: >
        The image is kept in two formats, as JPEG: LARGE (1600 px, 500 KB at most) for the page of the product,
        SMALL (400 px, 60 KB at most) for the cards of the catalog and the cart. It replaces the previous one
      operationId: addProductImage
      security:
      - bearerAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "204":
          description: The image is kept
        "403":
          description: The signed-in user is not an administrator
        "404":
          description: Unknown product
        "413":
          description: The image is larger than 2 MB
        "415":
          description: The file is not a JPEG, PNG or WebP image
    delete:
      tags:
      - Product images
      summary: Remove the image of a product (ADMIN role)
      operationId: removeProductImage
      security:
      - bearerAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The image is removed
        "404":
          description: The product has no image
  /api/stocks:
    get:
      tags:
      - Stocks
      summary: Retrieve the stocks of the products (a product without stock has none)
      operationId: getStocks
      responses:
        "200":
          description: The stocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonStock"
  /api/stocks/{productId}:
    get:
      tags:
      - Stocks
      summary: Retrieve the stock of a product (0 when it was never given)
      operationId: getStock
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The stock of the product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonStock"
  /api/admin/stocks/low:
    get:
      tags:
      - Stocks
      summary: Retrieve the stocks at or under the alert threshold of their product, from the lowest (ADMIN role)
      operationId: getLowStocks
      security:
      - bearerAuth: []
      responses:
        "200":
          description: The low stocks; a product whose stock was never given is not listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonLowStock"
        "403":
          description: The signed-in user is not an administrator
  /api/admin/stocks/{productId}/alert:
    get:
      tags:
      - Stocks
      summary: Retrieve the alert threshold of a product, the default one (5) when it was never given (ADMIN role)
      operationId: getStockAlert
      security:
      - bearerAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The alert threshold of the product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonStockAlert"
        "403":
          description: The signed-in user is not an administrator
    put:
      tags:
      - Stocks
      summary: Give the number of units at or under which the administrators are warned (ADMIN role)
      operationId: changeStockAlert
      security:
      - bearerAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonAlertThreshold"
      responses:
        "200":
          description: The new alert threshold of the product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonStockAlert"
        "400":
          description: Negative threshold
        "403":
          description: The signed-in user is not an administrator
        "404":
          description: Unknown product
  /api/admin/stocks/{productId}:
    put:
      tags:
      - Stocks
      summary: Give the number of units of a product that the shop has (ADMIN role)
      operationId: changeStock
      security:
      - bearerAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonStockQuantity"
      responses:
        "200":
          description: The new stock of the product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonStock"
        "400":
          description: Negative stock
        "403":
          description: The signed-in user is not an administrator
        "404":
          description: Unknown product
  /api/admin/orders:
    get:
      tags:
      - Administration
      summary: Retrieve a page of the orders of all the customers, newest first, with their customer (ADMIN role)
      description: The total number of orders is in the header X-Total-Count; a size above 100 is brought back
        to 100
      operationId: getAllOrders
      security:
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of the orders of all the customers
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonAdminOrder"
        "403":
          description: The signed-in user is not an administrator
  /api/admin/orders/{id}:
    get:
      tags:
      - Administration
      summary: Retrieve any order, with its customer (ADMIN role)
      operationId: getAnyOrder
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The order and its customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonAdminOrder"
        "403":
          description: The signed-in user is not an administrator
        "404":
          description: No order with this id
  /api/admin/orders/{id}/refund:
    post:
      tags:
      - Administration
      summary: Cancel a paid order before it is shipped, refund its payment and put its units back in stock (ADMIN role)
      description: "The order must be PAID or PROCESSING, and still have the status given; it becomes REFUNDED, its
        invoice is cancelled by a credit note (GET /api/orders/{id}/credit-note), and its customer is told by
        email."
      operationId: refundOrder
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonOrderRefund"
      responses:
        "200":
          description: The order, refunded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonAdminOrder"
        "403":
          description: The signed-in user is not an administrator
        "404":
          description: No order with this id
        "409":
          description: The order no longer has the given status, or it cannot be refunded (not paid, or shipped)
        "502":
          description: The payment provider refused the refund; the order is unchanged
  /api/admin/orders/{id}/status/advance:
    post:
      tags:
      - Administration
      summary: Move an order to the next status of its life cycle, PROCESSING then SHIPPED then DELIVERED (ADMIN role)
      description: "Moving a processed order to SHIPPED may give the carrier and the tracking number of its parcel,
        together or not at all; its customer sees them on the order and in the email that tells them it is shipped."
      operationId: advanceOrderStatus
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonOrderStatusAdvance"
      responses:
        "200":
          description: The order at its next status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonAdminOrder"
        "400":
          description: A carrier without a tracking number (or the opposite), an unknown carrier, an invalid tracking
            number, or a tracking given while the order is not moved to shipped
        "403":
          description: The signed-in user is not an administrator
        "404":
          description: No order with this id
        "409":
          description: The order no longer has the given status, or it is delivered (no next status)
  /api/admin/orders/{id}/tracking:
    put:
      tags:
      - Administration
      summary: Correct the carrier and the tracking number of an order that is shipped or delivered (ADMIN role)
      description: "The customer is not told again: they read the correction on their order."
      operationId: correctOrderTracking
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonOrderTrackingCorrection"
      responses:
        "200":
          description: The order, with its new tracking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonAdminOrder"
        "400":
          description: A missing or unknown carrier, or a tracking number that is missing or invalid
        "403":
          description: The signed-in user is not an administrator
        "404":
          description: No order with this id
        "409":
          description: The order is not shipped or delivered
components:
  headers:
    TotalCount:
      description: The number of items of the whole list, whatever the page read
      schema:
        type: integer
        format: int64
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: The number of the page, from 0 (a negative number is brought back to 0)
      schema:
        type: integer
        default: 0
        minimum: 0
    PageSize:
      name: size
      in: query
      required: false
      description: The number of items of a page (a size out of 1 to 100 is brought back to the nearest limit)
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    CartId:
      name: X-Cart-Id
      in: header
      required: false
      description: Id of the visitor cart (a UUID), returned by POST /api/cart/save
      schema:
        type: string
    LegalPageKindPath:
      name: kind
      in: path
      required: true
      description: The legal notice or the terms of sale
      schema:
        type: string
        enum: [legal-notice, terms-of-sale]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    JsonLegalPage:
      type: object
      required:
        - id
        - kind
        - text
        - publishedAt
      properties:
        id:
          type: string
          description: The id of this version of the page; the customers accept the terms of sale by it
        kind:
          type: string
          enum: [LEGAL_NOTICE, TERMS_OF_SALE]
        text:
          type: string
          description: Plain text, its paragraphs separated by line breaks; empty until the administrators write it
        publishedAt:
          type: string
          format: date-time
    JsonLegalText:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: Plain text, its paragraphs separated by line breaks, 50 000 characters at most
    JsonSeller:
      type: object
      required:
        - name
        - address
        - siret
        - vatNumber
        - phone
        - email
        - website
        - legalForm
        - shareCapital
        - registryCity
      properties:
        name:
          type: string
        address:
          type: string
          description: On one line
        siret:
          type: string
          description: 14 digits, spaces allowed
          example: 123 456 789 00012
        vatNumber:
          type: string
          description: Intra-community VAT number, the country then 2 to 13 digits or letters
          example: FR12345678901
        phone:
          type: string
          description: Digits, maybe after a +, grouped by spaces, dots, dashes or parentheses; empty in the versions written before it was asked
          example: 01 23 45 67 89
        email:
          type: string
          example: contact@flexstore.fr
        website:
          type: string
          description: With or without its scheme
          example: www.flexstore.fr
        legalForm:
          type: string
          description: SAS, SARL, EURL...; empty in the versions written before it was asked
          example: SAS
        shareCapital:
          type: string
          description: In euros, digits maybe grouped by spaces; empty in the versions written before it was asked
          example: 10 000
        registryCity:
          type: string
          description: The city of the trade and companies register (RCS); empty in the versions written before it was asked
          example: Paris
        socialNetworks:
          $ref: "#/components/schemas/JsonSocialNetworks"
          description: Always given when read; when written, omitted or missing networks stay empty
    JsonSocialNetworks:
      type: object
      description: The accounts of the shop on the social networks, as web addresses with or without their scheme; empty where the shop has none
      required:
        - facebook
        - instagram
        - x
        - tiktok
        - youtube
        - twitch
      properties:
        facebook:
          type: string
          example: https://www.facebook.com/flexstore
        instagram:
          type: string
          example: https://www.instagram.com/flexstore
        x:
          type: string
          example: https://x.com/flexstore
        tiktok:
          type: string
          example: https://www.tiktok.com/@flexstore
        youtube:
          type: string
          example: https://www.youtube.com/@flexstore
        twitch:
          type: string
          example: https://www.twitch.tv/flexstore
    JsonUser:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, LOCKED, DISABLED]
        twoFactorEnabled:
          type: boolean
          description: Whether two-factor authentication is enabled
    JsonLoginResponse:
      type: object
      description: >
        SIGNED_IN: token, expiresAt and user are filled.
        TWO_FACTOR_REQUIRED: the password was right, but the code of the authenticator app is still needed;
        only challengeId is filled. POST it with the code to /api/users/login/two-factor-authentication.
      required:
        - status
      properties:
        status:
          type: string
          enum: [SIGNED_IN, TWO_FACTOR_REQUIRED]
        token:
          type: string
          nullable: true
          description: "JWT to send in the Authorization header: Bearer <token>"
        expiresAt:
          type: string
          format: date-time
          nullable: true
        refreshToken:
          type: string
          nullable: true
          description: Opaque secret that renews the token once it expired (POST /api/users/refresh); it works once
        refreshExpiresAt:
          type: string
          format: date-time
          nullable: true
        user:
          $ref: "#/components/schemas/JsonUser"
        challengeId:
          type: string
          nullable: true
          description: Present when status is TWO_FACTOR_REQUIRED
    JsonRefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    JsonRefreshResponse:
      type: object
      required:
        - token
        - expiresAt
        - refreshToken
        - refreshExpiresAt
      properties:
        token:
          type: string
          description: "JWT to send in the Authorization header: Bearer <token>"
        expiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: The refresh token that replaces the one presented
        refreshExpiresAt:
          type: string
          format: date-time
    JsonUserUpdate:
      type: object
      description: The fields an administrator can edit; the password is changed by a separate operation
      required:
        - firstName
        - lastName
        - email
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
          description: Role of the user (USER when absent)
    JsonUserCreate:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
          description: User's password (will be hashed by the server)
        role:
          type: string
          enum: [USER, ADMIN]
          description: Role of the new user (USER when absent)
    JsonAccountRegistration:
      type: object
      required: [firstName, lastName, email, password, phoneNumber, postalAddress]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
          description: At least 8 characters (will be hashed by the server)
        phoneNumber:
          type: string
        postalAddress:
          $ref: "#/components/schemas/JsonPostalAddress"
        company:
          $ref: "#/components/schemas/JsonCustomerCompany"
    JsonCustomerCompany:
      type: object
      description: The company a customer buys for (none for a customer who buys for themselves); the address given at the creation of the account is sent to it, for the attention of the customer
      required: [companyName, siren]
      properties:
        companyName:
          type: string
        siren:
          type: string
          description: 9 digits (spaces dropped)
        vatNumber:
          type: string
          description: Optional intra-community VAT number (spaces dropped, upper case); a French one is FR, a key of 2 characters, then the SIREN
    JsonAccountStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, LOCKED, DISABLED]
    JsonEmailVerification:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token of the link (query parameter token of the verification page)
    JsonPasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: The email of the account whose password is forgotten
    JsonChosenPassword:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: The token of the link (query parameter token of the page to choose a new password)
        password:
          type: string
          description: The new password, 8 characters at least
    JsonPostalAddress:
      type: object
      description: >
        A postal address: its recipient, maybe someone else than the user, and where it is.
        The recipient is a person (PRIVATE_INDIVIDUAL, with firstName and lastName)
        or a company (LEGAL_ENTITY, with companyName and an optional vatNumber)
      required: [recipientType, street, postalCode, city, country]
      properties:
        recipientType:
          type: string
          enum: [PRIVATE_INDIVIDUAL, LEGAL_ENTITY]
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        companyName:
          type: string
          nullable: true
        vatNumber:
          type: string
          nullable: true
          description: The VAT identification number of the company (optional)
        street:
          type: string
        complement:
          type: string
          nullable: true
          description: Building, floor... (optional)
        postalCode:
          type: string
        city:
          type: string
        country:
          type: string
    JsonChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          description: New password, at least 8 characters (will be hashed by the server)
    JsonLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: User's email address
        password:
          type: string
          description: User's password (plain text)
    JsonTwoFactorEnrollment:
      type: object
      description: What a customer or administrator reads once an enrollment started, to set up their
        authenticator app
      required: [secret, provisioningUri]
      properties:
        secret:
          type: string
          description: The secret, to type manually in the authenticator app
        provisioningUri:
          type: string
          description: An otpauth:// link, to render as a QR code
    JsonTwoFactorCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: The 6-digit code of the authenticator app
    JsonTwoFactorDisableRequest:
      type: object
      required: [currentPassword]
      properties:
        currentPassword:
          type: string
    JsonTwoFactorChallengeVerification:
      type: object
      required: [challengeId, code]
      properties:
        challengeId:
          type: string
          description: The challengeId returned by POST /api/users/login when status is TWO_FACTOR_REQUIRED
        code:
          type: string
          description: The 6-digit code of the authenticator app
    DraftJsonProduct:
      type: object
