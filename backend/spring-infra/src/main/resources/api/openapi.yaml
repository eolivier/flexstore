        id:
          type: string
        sku:
          type: string
          description: Stock Keeping Unit, unique in the catalog
        name:
          type: string
          description: In the language asked (Accept-Language), or in en when the product is not translated into it
        description:
          type: string
          description: In the language asked (Accept-Language), or in en when the product is not translated into it
        category:
          type: string
        price:
          type: number
          description: The regular price. Shown struck through when the product is on promotion
        currency:
          type: string
        promotionPercentage:
          type: number
          nullable: true
          description: The percentage off the regular price while a promotion is running, null otherwise
        currentPrice:
          type: number
          description: The price to pay, the promotion included (the regular price when there is none)
    JsonAdminProduct:
      type: object
      description: A product as the administrator edits it, with its translations in every language
      required: [id, sku, category, price, currency, translations, vatRate]
      properties:
        id:
          type: string
        sku:
          type: string
          description: Stock Keeping Unit, unique in the catalog
        category:
          type: string
        price:
          type: number
        currency:
          type: string
        translations:
          type: array
          description: The name and the description in every language of the product, the default one (en) included
          items:
            $ref: "#/components/schemas/JsonProductTranslation"
        vatRate:
          type: string
          enum: [STANDARD, INTERMEDIATE, REDUCED, SUPER_REDUCED]
          description: "The rate of VAT included in the price: 20, 10, 5.5 or 2.1 %"
        promotion:
          $ref: "#/components/schemas/JsonPromotion"
    JsonPromotion:
      type: object
