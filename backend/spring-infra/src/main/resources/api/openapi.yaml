openapi: 3.0.1
info:
  title: Flexstore API
  description: REST contracts for Flexstore (hexagonal architecture online store sample project)
  contact:
    name: Emmanuel Olivier
    url: https://github.com/eolivier
  version: v0.1.0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/users/{id}:
    get:
      tags:
      - Users
      summary: Retrieve a user by ID
      operationId: getUser
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully retrieved the user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonUser"
    put:
      tags:
      - Users
      summary: Edit a user by ID (first name, last name, email, role; not the password)
      description: Reserved to an administrator, checked by the domain (403 otherwise)
      operationId: updateUser
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonUserUpdate"
        required: true
      responses:
        "200":
          description: The edited user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonUser"
        "403":
          description: The editor is not an administrator
        "404":
          description: Unknown user
        "409":
          description: The email is used by another user
    delete:
      tags:
      - Users
      summary: Delete a user by ID
      operationId: deleteUser
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Successfully deleted the user
  /api/users:
    get:
      tags:
      - Users
      summary: Retrieve all users
      description: Returns the full list of users
      operationId: getAllUsers
      security:
      - bearerAuth: []
      responses:
        "200":
          description: Successfully retrieved the list of users
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonUser"
    post:
      tags:
      - Users
      summary: Create a user
      operationId: createUser
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonUserCreate"
        required: true
      responses:
        "201":
          description: User created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonUser"
  /api/users/{id}/status:
    put:
      tags:
      - Users
      summary: Change the status of an account
      description: "Reserved to an administrator, on another account than their own. ACTIVE, SUSPENDED, LOCKED or
        DISABLED; a suspended, locked or disabled account can neither sign in nor order."
      operationId: changeAccountStatus
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonAccountStatus"
        required: true
      responses:
        "200":
          description: The user with their new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonUser"
        "403":
          description: The editor is not an administrator
        "422":
          description: Own account, PENDING_VERIFICATION or unknown status
  /api/users/{id}/password:
    post:
      tags:
      - Users
      summary: Change the password of a user
      operationId: changePassword
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonChangePasswordRequest"
        required: true
      responses:
        "204":
          description: Password changed
        "400":
          description: Wrong current password
        "401":
          description: Missing or invalid token
        "403":
          description: Not the password of the signed-in user
        "422":
          description: New password too short
  /api/accounts:
    post:
      tags:
      - Accounts
      summary: Create the account of a customer and send them a verification link, valid for 1 hour
      description: "Public. The account waits for the verification of the email (status PENDING_VERIFICATION);
        the customer can already sign in and order."
      operationId: registerAccount
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonAccountRegistration"
        required: true
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonUser"
        "409":
          description: The email is already used
        "422":
          description: A required field is missing or the password has fewer than 8 characters
  /api/accounts/me:
    get:
      tags:
      - Accounts
      summary: Retrieve the account of the signed-in user, with their phone number and postal addresses
      operationId: getAccount
      security:
      - bearerAuth: []
      responses:
        "200":
          description: The account (never the password)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonAccount"
        "401":
          description: Not signed in
  /api/accounts/me/addresses:
    get:
      tags:
      - Accounts
      summary: Retrieve the postal addresses of the signed-in user, in their order
      operationId: getAddresses
      security:
      - bearerAuth: []
      responses:
        "200":
          description: The addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonPostalAddress"
  /api/accounts/me/addresses/{position}:
    put:
      tags:
      - Accounts
      summary: Change an address of the signed-in user (0 for the first one); the orders keep theirs
      operationId: changeAddress
      security:
      - bearerAuth: []
      parameters:
      - name: position
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonPostalAddress"
      responses:
        "200":
          description: The addresses, with the changed one at its place
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonPostalAddress"
        "400":
          description: Incomplete address
        "404":
          description: No address at this position
    delete:
      tags:
      - Accounts
      summary: Remove an address of the signed-in user (0 for the first one); the orders keep theirs
      operationId: removeAddress
      security:
      - bearerAuth: []
      parameters:
      - name: position
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: The remaining addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonPostalAddress"
        "404":
          description: No address at this position
  /api/accounts/email-verification:
    post:
      tags:
      - Accounts
      summary: Verify the email of an account with the token of the link sent by email
      description: "Public. The account becomes ACTIVE and the link cannot be used again."
      operationId: verifyEmail
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonEmailVerification"
        required: true
      responses:
        "204":
          description: Email verified
        "404":
          description: Unknown link, or link already used
        "410":
          description: Link older than 1 hour
  /api/accounts/me/verification-email:
    post:
      tags:
      - Accounts
      summary: Send a new verification link (valid for 1 hour) to the signed-in customer
      description: The previous links stop working
      operationId: sendVerificationEmail
      security:
      - bearerAuth: []
      responses:
        "204":
          description: Link sent
        "401":
          description: Not signed in
        "409":
          description: The email is already verified
  /api/password-reset-requests:
    post:
      tags:
      - Accounts
      summary: Send a link to choose a new password (valid for 1 hour) to the email, if it has an account
      description: "Public. The answer is the same whether the email has an account or not. A new link replaces the\
        \ previous one."
      operationId: requestPasswordReset
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonPasswordResetRequest"
        required: true
      responses:
        "204":
          description: Link sent if the email has an account
  /api/password-resets:
    post:
      tags:
      - Accounts
      summary: Choose a new password with the token of the link sent by email
      description: "Public. The link cannot be used again."
      operationId: resetPassword
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonChosenPassword"
        required: true
      responses:
        "204":
          description: Password changed
        "404":
          description: Unknown link, or link already used
        "410":
          description: Link older than 1 hour
        "422":
          description: Password shorter than 8 characters
  /api/users/login:
    post:
      tags:
      - Users
      summary: Authenticate a user
      description: Validates user credentials and returns user information on success
      operationId: loginUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonLoginRequest"
        required: true
      responses:
        "200":
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonLoginResponse"
        "401":
          description: Invalid credentials
        "403":
          description: "The account is SUSPENDED, LOCKED or DISABLED: { error, status }"
  /api/products:
    post:
      tags:
      - Products
      summary: Create a product
      operationId: create
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftJsonProduct"
        required: true
      responses:
        "201":
          description: Product created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonProduct"
  /api/cart/save:
    post:
      tags:
      - Cart
      summary: Add an item to the cart, or change the quantity of an item (0 removes it)
      description: "The cart of the signed-in customer (bearer token), otherwise the cart of the visitor
        given by X-Cart-Id; without X-Cart-Id, a visitor cart is created and its id is returned."
      operationId: addItem
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/CartId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonItem"
        required: true
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSaveItemResponse"
        "404":
          description: Unknown product
        "422":
          description: A new item needs a positive quantity
  /api/cart/merge:
    post:
      tags:
      - Cart
      summary: Merge the cart of the visitor (X-Cart-Id) into the cart of the signed-in customer
      description: "All the items are kept; for a product in both carts, the larger quantity is kept.
        The visitor cart is then deleted."
      operationId: mergeCarts
      security:
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/CartId"
      responses:
        "204":
          description: Merged
        "401":
          description: Not signed in
  /api/products/:
    get:
      tags:
      - Products
      summary: Retrieve all products
      description: Returns the full list of available products
      operationId: getProducts
      responses:
        "200":
          description: Successfully retrieved the list of products
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonProduct"
  /api/products/{id}:
    get:
      tags:
      - Products
      summary: Retrieve a product by ID
      operationId: getProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully retrieved the product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonProduct"
        "404":
          description: Product not found
    put:
      tags:
      - Products
      summary: Edit a product (name, description, category, price)
      description: Reserved to an administrator
      operationId: updateProduct
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditedJsonProduct"
        required: true
      responses:
        "200":
          description: The edited product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonProduct"
        "401":
          description: Not signed in
        "403":
          description: Not an administrator
        "404":
          description: Unknown product
  /api/cart/cart-items:
    get:
      tags:
      - Cart
      summary: Retrieve the items of the cart of the customer or of the visitor
      description: "The cart of the signed-in customer (bearer token), otherwise the cart of the visitor
        given by X-Cart-Id (empty without it)."
      operationId: getCartItems
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/CartId"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonCartItems"
  /api/orders:
    post:
      tags:
      - Orders
      summary: Place an order from the cart of the signed-in customer; it awaits its payment
      description: >
        The order is delivered and billed to the given addresses (the delivery address when no billing address
        is given), which become addresses of the customer when they are new. The cart is kept until the order
        is paid (POST /api/orders/{id}/payment)
      operationId: placeOrder
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonOrderAddresses"
        required: true
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonOrder"
        "401":
          description: Not signed in
        "400":
          description: Incomplete delivery or billing address
        "409":
          description: Not enough units in stock for a product of the cart
        "403":
          description: "The account is SUSPENDED, LOCKED or DISABLED: { error, status }"
        "422":
          description: The cart is empty
    get:
      tags:
      - Orders
      summary: Retrieve the orders of the signed-in customer, newest first
      operationId: getOrders
      security:
      - bearerAuth: []
      responses:
        "200":
          description: The orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonOrder"
  /api/orders/{id}:
    get:
      tags:
      - Orders
      summary: Retrieve an order of the signed-in customer
      operationId: getOrder
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonOrder"
        "404":
          description: No order with this id for the signed-in customer
  /api/orders/{id}/payment:
    post:
      tags:
      - Payments
      summary: Start the payment of an order of the signed-in customer, then open its checkout page
      description: >
        With Stripe, the customer pays on the checkout page of Stripe, which confirms the payment later with its
        webhook (outcome PENDING). Without a Stripe key, the payment is simulated and confirmed at once (outcome
        PAID). Once paid, the cart is emptied and the order confirmed to the customer by email
      operationId: payOrder
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "201":
          description: The payment is started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonPaymentSession"
        "404":
          description: No order with this id for the signed-in customer
        "409":
          description: The order is already paid
  /api/payments/stripe/webhook:
    post:
      tags:
      - Payments
      summary: "Notification of Stripe: a checkout session is completed (called by Stripe, not by the front)"
      description: Authenticated by its Stripe-Signature header, verified with the secret of the webhook
      operationId: stripeNotification
      parameters:
      - name: Stripe-Signature
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Notification handled
        "400":
          description: Invalid signature
        "404":
          description: No Stripe key configured (simulated payments)
  /api/product-images:
    get:
      tags:
      - Product images
      summary: Retrieve the ids of the products that have an image
      operationId: getProductsWithImage
      responses:
        "200":
          description: The ids of the products with an image
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/products/{productId}/image:
    get:
      tags:
      - Product images
      summary: Retrieve the image of a product, in the small (cards, cart) or large (page) format
      description: A JPEG, with an ETag; the browser asks again with If-None-Match and gets 304 when unchanged
      operationId: getProductImage
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum: [small, large]
          default: large
      responses:
        "200":
          description: The image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The image did not change
        "404":
          description: The product has no image
  /api/admin/products/{productId}/image:
    put:
      tags:
      - Product images
      summary: Give the image of a product, 2 MB at most (JPEG, PNG or WebP), kept resized (ADMIN role)
      description: >
        The image is kept in two formats, as JPEG: LARGE (1600 px, 500 KB at most) for the page of the product,
        SMALL (400 px, 60 KB at most) for the cards of the catalog and the cart. It replaces the previous one
      operationId: addProductImage
      security:
      - bearerAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "204":
          description: The image is kept
        "403":
          description: The signed-in user is not an administrator
        "404":
          description: Unknown product
        "413":
          description: The image is larger than 2 MB
        "415":
          description: The file is not a JPEG, PNG or WebP image
    delete:
      tags:
      - Product images
      summary: Remove the image of a product (ADMIN role)
      operationId: removeProductImage
      security:
      - bearerAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The image is removed
        "404":
          description: The product has no image
  /api/stocks:
    get:
      tags:
      - Stocks
      summary: Retrieve the stocks of the products (a product without stock has none)
      operationId: getStocks
      responses:
        "200":
          description: The stocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonStock"
  /api/stocks/{productId}:
    get:
      tags:
      - Stocks
      summary: Retrieve the stock of a product (0 when it was never given)
      operationId: getStock
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The stock of the product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonStock"
  /api/admin/stocks/{productId}:
    put:
      tags:
      - Stocks
      summary: Give the number of units of a product that the shop has (ADMIN role)
      operationId: changeStock
      security:
      - bearerAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonStockQuantity"
      responses:
        "200":
          description: The new stock of the product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonStock"
        "400":
          description: Negative stock
        "403":
          description: The signed-in user is not an administrator
        "404":
          description: Unknown product
  /api/admin/orders:
    get:
      tags:
      - Administration
      summary: Retrieve the orders of all the customers, newest first (ADMIN role)
      operationId: getAllOrders
      security:
      - bearerAuth: []
      responses:
        "200":
          description: The orders of all the customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonOrder"
        "403":
          description: The signed-in user is not an administrator
  /api/admin/orders/{id}/status/advance:
    post:
      tags:
      - Administration
      summary: Move an order to the next status of its life cycle, PROCESSING then SHIPPED then DELIVERED (ADMIN role)
      operationId: advanceOrderStatus
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonOrderStatusAdvance"
      responses:
        "200":
          description: The order at its next status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonOrder"
        "403":
          description: The signed-in user is not an administrator
        "404":
          description: No order with this id
        "409":
          description: The order no longer has the given status, or it is delivered (no next status)
components:
  parameters:
    CartId:
      name: X-Cart-Id
      in: header
      required: false
      description: Id of the visitor cart (a UUID), returned by POST /api/cart/save
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    JsonUser:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, LOCKED, DISABLED]
    JsonLoginResponse:
      type: object
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          description: "JWT to send in the Authorization header: Bearer <token>"
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/JsonUser"
    JsonUserUpdate:
      type: object
      description: The fields an administrator can edit; the password is changed by a separate operation
      required:
        - firstName
        - lastName
        - email
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
          description: Role of the user (USER when absent)
    JsonUserCreate:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
          description: User's password (will be hashed by the server)
        role:
          type: string
          enum: [USER, ADMIN]
          description: Role of the new user (USER when absent)
    JsonAccountRegistration:
      type: object
      required: [firstName, lastName, email, password, phoneNumber, postalAddress]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
          description: At least 8 characters (will be hashed by the server)
        phoneNumber:
          type: string
        postalAddress:
          $ref: "#/components/schemas/JsonPostalAddress"
    JsonAccountStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, LOCKED, DISABLED]
    JsonEmailVerification:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token of the link (query parameter token of the verification page)
    JsonPasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: The email of the account whose password is forgotten
    JsonChosenPassword:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: The token of the link (query parameter token of the page to choose a new password)
        password:
          type: string
          description: The new password, 8 characters at least
    JsonPostalAddress:
      type: object
      description: >
        A postal address: its recipient, maybe someone else than the user, and where it is.
        The recipient is a person (PRIVATE_INDIVIDUAL, with firstName and lastName)
        or a company (LEGAL_ENTITY, with companyName and an optional vatNumber)
      required: [recipientType, street, postalCode, city, country]
      properties:
        recipientType:
          type: string
          enum: [PRIVATE_INDIVIDUAL, LEGAL_ENTITY]
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        companyName:
          type: string
          nullable: true
        vatNumber:
          type: string
          nullable: true
          description: The VAT identification number of the company (optional)
        street:
          type: string
        complement:
          type: string
          nullable: true
          description: Building, floor... (optional)
        postalCode:
          type: string
        city:
          type: string
        country:
          type: string
    JsonChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          description: New password, at least 8 characters (will be hashed by the server)
    JsonLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: User's email address
        password:
          type: string
          description: User's password (plain text)
    DraftJsonProduct:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: number
        currency:
          type: string
    EditedJsonProduct:
      type: object
      description: The fields an administrator edits; the id is given by the path
      required: [name, description, category, price, currency]
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: number
        currency:
          type: string
          description: Currency code (EUR)
    JsonProduct:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: number
        currency:
          type: string
    JsonItem:
      type: object
      properties:
        itemId:
          type: string
        productId:
          type: string
        productName:
          type: string
        productDescription:
          type: string
        productCategory:
          type: string
        productPrice:
          type: number
        productCurrency:
          type: string
        productQuantity:
          type: integer
          format: int32
    JsonCartItem:
      type: object
      properties:
        itemId:
          type: string
        productId:
          type: string
        productName:
          type: string
        productDescription:
          type: string
        productCategory:
          type: string
        productPrice:
          type: number
        productCurrency:
          type: string
        productQuantity:
          type: integer
          format: int32
        itemPrice:
          type: number
    JsonOrder:
      type: object
      required: [id, placedAt, status, lines, totalPrice, currency, deliveryAddress, billingAddress]
      properties:
        id:
          type: string
        placedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [AWAITING_PAYMENT, PAID, PROCESSING, SHIPPED, DELIVERED]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/JsonOrderLine"
        totalPrice:
          type: number
        currency:
          type: string
        deliveryAddress:
          $ref: "#/components/schemas/JsonPostalAddress"
        billingAddress:
          $ref: "#/components/schemas/JsonPostalAddress"
    JsonPaymentSession:
      type: object
      required: [checkoutUrl, outcome]
      properties:
        checkoutUrl:
          type: string
          description: The page where the customer pays the order
        outcome:
          type: string
          enum: [PENDING, PAID]
          description: PAID when the payment is already confirmed (simulated payment)
    JsonStock:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          description: The number of units that the shop has
    JsonStockQuantity:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0
    JsonOrderStatusAdvance:
      type: object
      description: The status of the order when the administrator asks to move it to the next one
      required: [currentStatus]
      properties:
        currentStatus:
          type: string
          enum: [AWAITING_PAYMENT, PAID, PROCESSING, SHIPPED, DELIVERED]
    JsonOrderAddresses:
      type: object
      required: [deliveryAddress]
      properties:
        deliveryAddress:
          $ref: "#/components/schemas/JsonPostalAddress"
        billingAddress:
          $ref: "#/components/schemas/JsonPostalAddress"
    JsonAccount:
      type: object
      required: [id, firstName, lastName, email, role, status, postalAddresses]
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, LOCKED, DISABLED]
        phoneNumber:
          type: string
          nullable: true
        postalAddresses:
          type: array
          items:
            $ref: "#/components/schemas/JsonPostalAddress"
    JsonOrderLine:
      type: object
      required: [productId, productName, unitPrice, quantity, linePrice]
      properties:
        productId:
          type: string
        productName:
          type: string
        unitPrice:
          type: number
        quantity:
          type: integer
        linePrice:
          type: number
    JsonSaveItemResponse:
      type: object
      properties:
        status:
          type: string
        cartId:
          type: string
          nullable: true
          description: Id of the visitor cart, to send in X-Cart-Id; null for a signed-in customer
    JsonCartItems:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JsonCartItem"
        totalItemsPrice:
          type: number
        itemsCurrency:
          type: string
