    JsonLowStock:
      type: object
      required: [productId, quantity, threshold]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          description: The units left, at or under the threshold
        threshold:
          type: integer
          description: The alert threshold of the product
    JsonCookieConsent:
      type: object
      required: [choice]
      properties:
        choice:
          type: string
          enum: [ACCEPTED, REFUSED, UNDECIDED]
        expiresAt:
          type: string
          format: date-time
          description: When the customer is asked again; absent when UNDECIDED
    JsonCookieChoice:
      type: object
      required: [choice]
      properties:
        choice:
          type: string
          enum: [ACCEPTED, REFUSED]
    JsonStockAlert:
      type: object
      required: [productId, threshold]
      properties:
        productId:
          type: string
        threshold:
          type: integer
          description: The number of units at or under which the administrators are warned
    JsonAlertThreshold:
      type: object
      required: [threshold]
      properties:
        threshold:
          type: integer
          minimum: 0
    JsonStockQuantity:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0
    JsonOrderStatusAdvance:
      type: object
      description: The status of the order when the administrator asks to move it to the next one; moving a
        processed order to shipped may give the carrier and the tracking number, together or not at all
      required: [currentStatus]
      properties:
        currentStatus:
          type: string
          enum: [AWAITING_PAYMENT, PAID, PROCESSING, SHIPPED, DELIVERED, CANCELLED, REFUNDED]
        carrier:
          type: string
          enum: [COLISSIMO, CHRONOPOST, UPS, DHL, FEDEX, OTHER]
        trackingNumber:
          type: string
          description: Letters, digits and hyphens, 40 at most
    JsonOrderTrackingCorrection:
      type: object
      required: [carrier, trackingNumber]
      properties:
        carrier:
          type: string
          enum: [COLISSIMO, CHRONOPOST, UPS, DHL, FEDEX, OTHER]
        trackingNumber:
          type: string
          description: Letters, digits and hyphens, 40 at most
    JsonOrderAddresses:
      type: object
      required: [deliveryAddress, termsOfSaleId]
      properties:
        deliveryAddress:
          $ref: "#/components/schemas/JsonPostalAddress"
        billingAddress:
          $ref: "#/components/schemas/JsonPostalAddress"
        shippingMethod:
          type: string
          enum: [STANDARD, EXPRESS]
          description: STANDARD when not given
        discountCode:
          type: string
          description: The discount code entered, if any (404 when unknown, 410 when expired or used up)
        termsOfSaleId:
          type: string
          description: The id of the version of the terms of sale the customer read and accepted
    JsonDiscountPreview:
      type: object
      required: [code, amountOff, currency]
      properties:
        code:
          type: string
        amountOff:
          type: number
        currency:
          type: string
    JsonReview:
      type: object
      required: [id, productId, reviewerName, rating, comment, reviewedAt]
      properties:
        id:
          type: string
        productId:
          type: string
        reviewerName:
          type: string
          description: The first name and the initial of the last name of the customer (Marie D.)
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        reviewedAt:
          type: string
          format: date-time
    JsonNewReview:
      type: object
      required: [rating, comment]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
    JsonReviewEligibility:
      type: object
      required: [eligibility]
      properties:
        eligibility:
          type: string
          enum: [CAN_REVIEW, NOT_BOUGHT, ALREADY_REVIEWED]
    JsonRatingSummary:
      type: object
      required: [productId, average, reviewCount]
      properties:
        productId:
          type: string
        average:
          type: number
          description: The average of the ratings, from 1 to 5, with one decimal
        reviewCount:
          type: integer
    JsonSalesDashboard:
      type: object
      required: [firstDay, lastDay, currency, revenue, orderCount, days, bestSellers]
      properties:
        firstDay:
          type: string
          format: date
        lastDay:
          type: string
          format: date
        currency:
          type: string
        revenue:
          type: number
          description: What the paid orders of the period cost their customers (VAT and shipping included)
        orderCount:
          type: integer
        days:
          type: array
          description: Every day of the period, oldest first, with 0 for a day without order
          items:
            $ref: "#/components/schemas/JsonDailySales"
        bestSellers:
          type: array
          description: The 5 products with the most units sold
          items:
            $ref: "#/components/schemas/JsonBestSeller"
    JsonDailySales:
      type: object
      required: [day, orderCount, revenue]
      properties:
        day:
          type: string
          format: date
        orderCount:
          type: integer
        revenue:
          type: number
    JsonBestSeller:
      type: object
      required: [productId, productName, unitsSold, revenue]
      properties:
        productId:
          type: string
        productName:
          type: string
          description: The name of the product when it was ordered
        unitsSold:
          type: integer
        revenue:
          type: number
    JsonDiscountCode:
      type: object
      required: [code, reductionType, reductionValue, expiresAt, usageLimit, timesUsed]
      properties:
        code:
          type: string
        reductionType:
          type: string
          enum: [PERCENTAGE, AMOUNT]
        reductionValue:
          type: number
          description: A percentage from 1 to 100, or an amount in euros
        expiresAt:
          type: string
          format: date-time
        usageLimit:
          type: integer
        timesUsed:
          type: integer
    JsonNewDiscountCode:
      type: object
      required: [code, reductionType, reductionValue, expiresAt, usageLimit]
      properties:
        code:
          type: string
          description: Upper-case letters and digits, 3 to 30 (put in upper case)
        reductionType:
          type: string
          enum: [PERCENTAGE, AMOUNT]
        reductionValue:
          type: number
        expiresAt:
          type: string
          format: date-time
        usageLimit:
          type: integer
          description: 1 or more
    JsonShippingOptions:
      type: object
      required: [options, freeShippingThreshold, currency]
      properties:
        options:
          type: array
          items:
            $ref: "#/components/schemas/JsonShippingOption"
        freeShippingThreshold:
          type: number
          description: The price of the items from which the standard shipping is free (0 - always free)
        currency:
          type: string
    JsonShippingOption:
      type: object
      required: [method, cost]
      properties:
        method:
          type: string
          enum: [STANDARD, EXPRESS]
        cost:
          type: number
          description: For the items of the cart; 0 when free
    JsonAccount:
      type: object
      required: [id, firstName, lastName, email, role, status, postalAddresses, twoFactorEnabled]
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, LOCKED, DISABLED]
        phoneNumber:
          type: string
          nullable: true
        postalAddresses:
          type: array
          items:
            $ref: "#/components/schemas/JsonPostalAddress"
        company:
          $ref: "#/components/schemas/JsonCustomerCompany"
        twoFactorEnabled:
          type: boolean
          description: Whether two-factor authentication is enabled
    JsonOrderLine:
      type: object
      required: [productId, productName, unitPrice, quantity, linePrice]
      properties:
        productId:
          type: string
        productName:
          type: string
        unitPrice:
          type: number
        quantity:
          type: integer
        linePrice:
          type: number
    JsonSaveItemResponse:
      type: object
      properties:
        status:
          type: string
        cartId:
          type: string
          nullable: true
          description: Id of the visitor cart, to send in X-Cart-Id; null for a signed-in customer
    JsonCartItems:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JsonCartItem"
        totalItemsPrice:
          type: number
        itemsCurrency:
          type: string
