openapi: 3.0.1
info:
  title: Flexstore API
  description: REST contracts for Flexstore (hexagonal architecture online store sample project)
  contact:
    name: Emmanuel Olivier
    url: https://github.com/eolivier
  version: v0.1.0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/users/{id}:
    get:
      tags:
      - Users
      summary: Retrieve a user by ID
      operationId: getUser
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully retrieved the user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonUser"
    put:
      tags:
      - Users
      summary: Edit a user by ID (first name, last name, email, role; not the password)
      description: Reserved to an administrator, checked by the domain (403 otherwise)
      operationId: updateUser
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonUserUpdate"
        required: true
      responses:
        "200":
          description: The edited user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonUser"
        "403":
          description: The editor is not an administrator
        "404":
          description: Unknown user
        "409":
          description: The email is used by another user
    delete:
      tags:
      - Users
      summary: Delete a user by ID
      operationId: deleteUser
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Successfully deleted the user
  /api/users:
    get:
      tags:
      - Users
      summary: Retrieve a page of the users, the first created first (ADMIN role)
      description: The total number of users is in the header X-Total-Count; a size above 100 is brought back
        to 100
      operationId: getAllUsers
      security:
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of the users
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonUser"
    post:
      tags:
      - Users
      summary: Create a user
      operationId: createUser
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonUserCreate"
        required: true
      responses:
        "201":
          description: User created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonUser"
  /api/users/{id}/status:
    put:
      tags:
      - Users
      summary: Change the status of an account
      description: "Reserved to an administrator, on another account than their own. ACTIVE, SUSPENDED, LOCKED or
        DISABLED; a suspended, locked or disabled account can neither sign in nor order."
      operationId: changeAccountStatus
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonAccountStatus"
        required: true
      responses:
        "200":
          description: The user with their new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonUser"
        "403":
          description: The editor is not an administrator
        "422":
          description: Own account, PENDING_VERIFICATION or unknown status
  /api/users/{id}/password:
    post:
      tags:
      - Users
      summary: Change the password of a user
      operationId: changePassword
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonChangePasswordRequest"
        required: true
      responses:
        "204":
          description: Password changed
        "400":
          description: Wrong current password
        "401":
          description: Missing or invalid token
        "403":
          description: Not the password of the signed-in user
        "422":
          description: New password too short
  /api/users/{id}/two-factor-authentication/enrollment:
    post:
      tags:
      - Users
      summary: Start the enrollment of two-factor authentication
      description: >
        Generates a new secret and keeps it pending: it is not active until confirmed with the first code
        (POST /api/users/{id}/two-factor-authentication/confirmation).
      operationId: startTwoFactorEnrollment
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The secret and the link of the QR code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonTwoFactorEnrollment"
        "401":
          description: Missing or invalid token
        "403":
          description: Not the signed-in user
        "409":
          description: Two-factor authentication is already enabled
  /api/users/{id}/two-factor-authentication/confirmation:
    post:
      tags:
      - Users
      summary: Confirm the enrollment with the first code of the authenticator app
      operationId: confirmTwoFactorEnrollment
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonTwoFactorCode"
        required: true
      responses:
        "204":
          description: Two-factor authentication is now enabled
        "401":
          description: Wrong code
        "403":
          description: Not the signed-in user
        "409":
          description: No enrollment is pending
  /api/users/{id}/two-factor-authentication:
    put:
      tags:
      - Users
      summary: Disable the two-factor authentication of another user (administrator only)
      description: "Reserved to an administrator, on another account than their own. No current password is
        asked, unlike the self-service operation (DELETE /api/users/{id}/two-factor-authentication)."
      operationId: adminDisableTwoFactorAuthentication
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The user with two-factor authentication disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonUser"
        "403":
          description: Not an administrator
        "409":
          description: Two-factor authentication is not enabled
        "422":
          description: Own account, or unknown user
    delete:
      tags:
      - Users
      summary: Disable two-factor authentication, confirmed with the current password
      operationId: disableTwoFactorAuthentication
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonTwoFactorDisableRequest"
        required: true
      responses:
        "204":
          description: Two-factor authentication is now disabled
        "400":
          description: Wrong current password
        "403":
          description: Not the signed-in user
        "409":
          description: Two-factor authentication is not enabled
  /api/accounts:
    post:
      tags:
      - Accounts
      summary: Create the account of a customer and send them a verification link, valid for 1 hour
      description: "Public. The account waits for the verification of the email (status PENDING_VERIFICATION);
        the customer can already sign in and order."
      operationId: registerAccount
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonAccountRegistration"
        required: true
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonUser"
        "400":
          description: "Invalid company (reason INVALID_COMPANY): no name, a SIREN other than 9 digits, or a VAT number malformed or that does not agree with the SIREN"
        "409":
          description: The email is already used
        "422":
          description: A required field is missing or the password has fewer than 8 characters
  /api/accounts/me:
    get:
      tags:
      - Accounts
      summary: Retrieve the account of the signed-in user, with their phone number and postal addresses
      operationId: getAccount
      security:
      - bearerAuth: []
      responses:
        "200":
          description: The account (never the password)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonAccount"
        "401":
          description: Not signed in
  /api/accounts/me/addresses:
    get:
      tags:
      - Accounts
      summary: Retrieve the postal addresses of the signed-in user, in their order
      operationId: getAddresses
      security:
      - bearerAuth: []
      responses:
        "200":
          description: The addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonPostalAddress"
    post:
      tags:
      - Accounts
      summary: Add a new address to the signed-in user, at the end of their addresses
      operationId: addAddress
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonPostalAddress"
      responses:
        "201":
          description: The addresses, with the new one at the end
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonPostalAddress"
        "400":
          description: Incomplete address
  /api/accounts/me/addresses/{position}:
    put:
      tags:
      - Accounts
      summary: Change an address of the signed-in user (0 for the first one); the orders keep theirs
      operationId: changeAddress
      security:
      - bearerAuth: []
      parameters:
      - name: position
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonPostalAddress"
      responses:
        "200":
          description: The addresses, with the changed one at its place
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonPostalAddress"
        "400":
          description: Incomplete address
        "404":
          description: No address at this position
    delete:
      tags:
      - Accounts
      summary: Remove an address of the signed-in user (0 for the first one); the orders keep theirs
      operationId: removeAddress
      security:
      - bearerAuth: []
      parameters:
      - name: position
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: The remaining addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonPostalAddress"
        "404":
          description: No address at this position
  /api/accounts/email-verification:
    post:
      tags:
      - Accounts
      summary: Verify the email of an account with the token of the link sent by email
      description: "Public. The account becomes ACTIVE and the link cannot be used again."
      operationId: verifyEmail
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonEmailVerification"
        required: true
      responses:
        "204":
          description: Email verified
        "404":
          description: Unknown link, or link already used
        "410":
          description: Link older than 1 hour
  /api/accounts/me/verification-email:
    post:
      tags:
      - Accounts
      summary: Send a new verification link (valid for 1 hour) to the signed-in customer
      description: The previous links stop working
      operationId: sendVerificationEmail
      security:
      - bearerAuth: []
      responses:
        "204":
          description: Link sent
        "401":
          description: Not signed in
        "409":
          description: The email is already verified
  /api/password-reset-requests:
    post:
      tags:
      - Accounts
      summary: Send a link to choose a new password (valid for 1 hour) to the email, if it has an account
      description: "Public. The answer is the same whether the email has an account or not. A new link replaces the\
        \ previous one."
      operationId: requestPasswordReset
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonPasswordResetRequest"
        required: true
      responses:
        "204":
          description: Link sent if the email has an account
  /api/password-resets:
    post:
      tags:
      - Accounts
      summary: Choose a new password with the token of the link sent by email
      description: "Public. The link cannot be used again."
      operationId: resetPassword
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonChosenPassword"
        required: true
      responses:
        "204":
          description: Password changed
        "404":
          description: Unknown link, or link already used
        "410":
          description: Link older than 1 hour
        "422":
          description: Password shorter than 8 characters
  /api/users/login:
    post:
      tags:
      - Users
      summary: Authenticate a user
      description: "Validates user credentials and returns the token (valid for 15 minutes), the refresh token
        (valid for 7 days, it works once) and the user"
      operationId: loginUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonLoginRequest"
        required: true
      responses:
        "200":
          description: >
            SIGNED_IN: the token is returned with the user.
            TWO_FACTOR_REQUIRED: the code of the authenticator app is still needed, see
            POST /api/users/login/two-factor-authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonLoginResponse"
        "401":
          description: Invalid credentials
        "403":
          description: "The account is SUSPENDED, LOCKED or DISABLED: { error, status }"
  /api/users/refresh:
    post:
      tags:
      - Users
      summary: Renew the access of a signed-in user with their refresh token
      description: "The refresh token works once: the response holds a new token and a new refresh token that
        replaces it. A refresh token that was already used (or whose session was ended) ends all the sessions of
        its user. Public route: the refresh token is the credential."
      operationId: refreshSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRefreshRequest"
        required: true
      responses:
        "200":
          description: A new token and the refresh token that replaces the one presented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRefreshResponse"
        "401":
          description: Unknown, expired or already used refresh token
        "403":
          description: "The account is SUSPENDED, LOCKED or DISABLED: { error, status }"
  /api/users/logout:
    post:
      tags:
      - Users
      summary: Sign out, ending the session of a refresh token
      description: Signing out twice, or with an unknown refresh token, is no error
      operationId: logoutUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRefreshRequest"
        required: true
      responses:
        "204":
          description: The session is ended
  /api/users/login/two-factor-authentication:
    post:
      tags:
      - Users
      summary: Complete a challenged sign-in with the code of the authenticator app
      description: Public. The password was already checked by POST /api/users/login.
      operationId: verifyTwoFactorCode
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonTwoFactorChallengeVerification"
        required: true
      responses:
        "200":
          description: "Successfully authenticated: the token is returned with the user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonLoginResponse"
        "401":
          description: Wrong code, or unknown or expired challenge
  /api/products:
    post:
      tags:
      - Products
      summary: Create a product
      operationId: create
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftJsonProduct"
        required: true
      responses:
        "201":
          description: Product created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonProduct"
  /api/cart/save:
    post:
      tags:
      - Cart
      summary: Add an item to the cart, or change the quantity of an item (0 removes it)
      description: "The cart of the signed-in customer (bearer token), otherwise the cart of the visitor
        given by X-Cart-Id; without X-Cart-Id, a visitor cart is created and its id is returned."
      operationId: addItem
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/CartId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonItem"
        required: true
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSaveItemResponse"
        "404":
          description: Unknown product
        "422":
          description: A new item needs a positive quantity
  /api/cart/merge:
    post:
      tags:
      - Cart
      summary: Merge the cart of the visitor (X-Cart-Id) into the cart of the signed-in customer
      description: "All the items are kept; for a product in both carts, the larger quantity is kept.
        The visitor cart is then deleted."
      operationId: mergeCarts
      security:
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/CartId"
      responses:
        "204":
          description: Merged
        "401":
          description: Not signed in
  /api/cookie-consent:
    get:
      tags:
      - Cookies
      summary: Retrieve the cookie consent of the signed-in customer
      description: "UNDECIDED, without expiry, when the customer never chose or when their choice is 6 months
        old."
      operationId: getCookieConsent
      security:
      - bearerAuth: []
      responses:
        "200":
          description: The cookie consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonCookieConsent"
        "401":
          description: Not signed in
    put:
      tags:
      - Cookies
      summary: Record the choice of the signed-in customer about the preference cookies, for 6 months
      operationId: recordCookieConsent
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonCookieChoice"
      responses:
        "200":
          description: The recorded cookie consent, with its expiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonCookieConsent"
        "401":
          description: Not signed in
  /api/admin/products/sku-proposal:
    get:
      tags:
      - Administration
      summary: Propose a SKU free in the catalog, from the category and the name of a product (ADMIN role)
      description: "The first three letters of the category, the first two words of the name (eight characters at
        most each, without accents), then the first number from 0001 that no product has: CLO-ORGANIC-COTTON-0001"
      operationId: proposeSku
      security:
      - bearerAuth: []
      parameters:
      - name: category
        in: query
        required: true
        schema:
          type: string
      - name: name
        in: query
        required: false
        description: The name of the product in the default language (en), maybe not entered yet
        schema:
          type: string
      responses:
        "200":
          description: The SKU proposed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSkuProposal"
        "403":
          description: The signed-in user is not an administrator
  /api/admin/products/{id}:
    get:
      tags:
      - Administration
      summary: Retrieve a product with its translations in every language, to edit it
      operationId: getAdminProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The product with its translations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonAdminProduct"
        "404":
          description: Product not found
  /api/products/:
    get:
      tags:
      - Products
      summary: Retrieve all products
      description: Returns the full list of available products
      operationId: getProducts
      parameters:
      - name: Accept-Language
        in: header
        required: false
        description: The language of the customer (en, fr); the products not translated into it are in en
        schema:
          type: string
      responses:
        "200":
          description: Successfully retrieved the list of products
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonProduct"
  /api/products/{id}/reviews:
    get:
      tags:
      - Reviews
      summary: Retrieve the reviews of a product, newest first
      operationId: getReviews
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The reviews of the product
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonReview"
    post:
      tags:
      - Reviews
      summary: Review a product bought by the signed-in customer, once per product
      operationId: addReview
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonNewReview"
      responses:
        "201":
          description: The review written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonReview"
        "400":
          description: Invalid rating or comment
        "403":
          description: The customer did not buy (and pay for) the product
        "404":
          description: Product not found
        "409":
          description: The customer already reviewed the product
  /api/products/{id}/review-eligibility:
    get:
      tags:
      - Reviews
      summary: Tell whether the signed-in customer may review a product (bought and paid for, not reviewed yet)
      operationId: getReviewEligibility
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Whether the customer may review the product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonReviewEligibility"
        "401":
          description: Not signed in
  /api/product-ratings:
    get:
      tags:
      - Reviews
      summary: Retrieve what the customers think of each product that has reviews
      operationId: getRatings
      responses:
        "200":
          description: The average rating and the number of reviews of each reviewed product
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonRatingSummary"
  /api/wishlist:
    get:
      tags:
      - Wishlist
      summary: Retrieve the products the signed-in customer saved to their wishlist, newest first
      operationId: getWishlist
      security:
      - bearerAuth: []
      parameters:
      - name: Accept-Language
        in: header
        required: false
        description: The language of the customer (en, fr); the products not translated into it are in en
        schema:
          type: string
      responses:
        "200":
          description: The products saved to the wishlist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonProduct"
        "401":
          description: Not signed in
  /api/wishlist/{productId}:
    put:
      tags:
      - Wishlist
      summary: Save a product to the wishlist of the signed-in customer, once per product
      operationId: saveProductToWishlist
      security:
      - bearerAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Saved (already there, or saved now)
        "401":
          description: Not signed in
        "404":
          description: Unknown product
    delete:
      tags:
      - Wishlist
      summary: Remove a product from the wishlist of the signed-in customer
      operationId: removeProductFromWishlist
      security:
      - bearerAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed (or already absent)
        "401":
          description: Not signed in
  /api/products/{id}:
    get:
      tags:
      - Products
      summary: Retrieve a product by ID
      operationId: getProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Accept-Language
        in: header
        required: false
        description: The language of the customer (en, fr); the products not translated into it are in en
        schema:
          type: string
      responses:
        "200":
          description: Successfully retrieved the product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonProduct"
        "404":
          description: Product not found
    put:
      tags:
      - Products
      summary: Edit a product (SKU, translations, category, price)
      description: Reserved to an administrator
      operationId: updateProduct
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditedJsonProduct"
        required: true
      responses:
        "200":
          description: The edited product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonProduct"
        "400":
          description: Malformed SKU
        "401":
          description: Not signed in
        "403":
          description: Not an administrator
        "404":
          description: Unknown product
        "409":
          description: SKU used by another product
  /api/cart/cart-items:
    get:
      tags:
      - Cart
      summary: Retrieve the items of the cart of the customer or of the visitor
      description: "The cart of the signed-in customer (bearer token), otherwise the cart of the visitor
        given by X-Cart-Id (empty without it)."
      operationId: getCartItems
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/CartId"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonCartItems"
  /api/orders/{id}/invoice:
