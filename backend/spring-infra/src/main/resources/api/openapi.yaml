openapi: 3.0.1
info:
  title: Flexstore API
  description: REST contracts for Flexstore (hexagonal architecture online store sample project)
  contact:
    name: Emmanuel Olivier
    url: https://github.com/eolivier
  version: v0.1.0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/users/{id}:
    get:
      tags:
      - Users
      summary: Retrieve a user by ID
      operationId: getUser
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully retrieved the user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonUser"
    put:
      tags:
      - Users
      summary: Update a user by ID
      operationId: updateUser
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonUserUpdate"
        required: true
      responses:
        "200":
          description: Successfully updated the user
    delete:
      tags:
      - Users
      summary: Delete a user by ID
      operationId: deleteUser
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Successfully deleted the user
  /api/users:
    get:
      tags:
      - Users
      summary: Retrieve all users
      description: Returns the full list of users
      operationId: getAllUsers
      security:
      - bearerAuth: []
      responses:
        "200":
          description: Successfully retrieved the list of users
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonUser"
    post:
      tags:
      - Users
      summary: Create a user
      operationId: createUser
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonUserCreate"
        required: true
      responses:
        "201":
          description: User created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonUser"
  /api/users/{id}/password:
    post:
      tags:
      - Users
      summary: Change the password of a user
      operationId: changePassword
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonChangePasswordRequest"
        required: true
      responses:
        "204":
          description: Password changed
        "400":
          description: Wrong current password
        "401":
          description: Missing or invalid token
        "403":
          description: Not the password of the signed-in user
        "422":
          description: New password too short
  /api/users/login:
    post:
      tags:
      - Users
      summary: Authenticate a user
      description: Validates user credentials and returns user information on success
      operationId: loginUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonLoginRequest"
        required: true
      responses:
        "200":
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonLoginResponse"
        "401":
          description: Invalid credentials
  /api/products:
    post:
      tags:
      - Products
      summary: Create a product
      operationId: create
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftJsonProduct"
        required: true
      responses:
        "201":
          description: Product created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonProduct"
  /api/cart/save:
    post:
      tags:
      - Cart
      summary: Add an item to the cart
      operationId: addItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonItem"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                type: object
  /api/products/:
    get:
      tags:
      - Products
      summary: Retrieve all products
      description: Returns the full list of available products
      operationId: getProducts
      responses:
        "200":
          description: Successfully retrieved the list of products
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonProduct"
  /api/products/{id}:
    get:
      tags:
      - Products
      summary: Retrieve a product by ID
      operationId: getProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully retrieved the product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonProduct"
        "404":
          description: Product not found
  /api/cart/cart-items:
    get:
      tags:
      - Cart
      summary: Retrieve all cart items
      description: Returns the full list of items in the cart
      operationId: getCartItems
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonCartItems"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    JsonUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
    JsonLoginResponse:
      type: object
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          description: "JWT to send in the Authorization header: Bearer <token>"
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/JsonUser"
    JsonUserUpdate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        password:
          type: string
          description: User's new password (will be hashed by the server). Omit it or leave it blank to keep the current password
    JsonUserCreate:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
          description: User's password (will be hashed by the server)
    JsonChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          description: New password, at least 8 characters (will be hashed by the server)
    JsonLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: User's email address
        password:
          type: string
          description: User's password (plain text)
    DraftJsonProduct:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: number
        currency:
          type: string
    JsonProduct:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: number
        currency:
          type: string
    JsonItem:
      type: object
      properties:
        itemId:
          type: string
        productId:
          type: string
        productName:
          type: string
        productDescription:
          type: string
        productCategory:
          type: string
        productPrice:
          type: number
        productCurrency:
          type: string
        productQuantity:
          type: integer
          format: int32
    JsonCartItem:
      type: object
      properties:
        itemId:
          type: string
        productId:
          type: string
        productName:
          type: string
        productDescription:
          type: string
        productCategory:
          type: string
        productPrice:
          type: number
        productCurrency:
          type: string
        productQuantity:
          type: integer
          format: int32
        itemPrice:
          type: number
    JsonCartItems:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JsonCartItem"
        totalItemsPrice:
          type: number
        itemsCurrency:
          type: string
