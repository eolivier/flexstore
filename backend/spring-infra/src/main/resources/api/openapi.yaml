openapi: 3.0.1
info:
  title: Flexstore API
  description: REST contracts for Flexstore (hexagonal architecture online store sample project)
  contact:
    name: Emmanuel Olivier
    url: https://github.com/eolivier
  version: v0.1.0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/users/{id}:
    get:
      tags:
      - Users
      summary: Retrieve a user by ID
      operationId: getUser
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully retrieved the user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonUser"
    put:
      tags:
      - Users
      summary: Edit a user by ID (first name, last name, email, role; not the password)
      description: Reserved to an administrator, checked by the domain (403 otherwise)
      operationId: updateUser
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonUserUpdate"
        required: true
      responses:
        "200":
          description: The edited user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonUser"
        "403":
          description: The editor is not an administrator
        "404":
          description: Unknown user
        "409":
          description: The email is used by another user
    delete:
      tags:
      - Users
      summary: Delete a user by ID
      operationId: deleteUser
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Successfully deleted the user
  /api/users:
    get:
      tags:
      - Users
      summary: Retrieve all users
      description: Returns the full list of users
      operationId: getAllUsers
      security:
      - bearerAuth: []
      responses:
        "200":
          description: Successfully retrieved the list of users
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonUser"
    post:
      tags:
      - Users
      summary: Create a user
      operationId: createUser
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonUserCreate"
        required: true
      responses:
        "201":
          description: User created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonUser"
  /api/users/{id}/status:
    put:
      tags:
      - Users
      summary: Change the status of an account
      description: "Reserved to an administrator, on another account than their own. ACTIVE, SUSPENDED, LOCKED or
        DISABLED; a suspended, locked or disabled account can neither sign in nor order."
      operationId: changeAccountStatus
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonAccountStatus"
        required: true
      responses:
        "200":
          description: The user with their new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonUser"
        "403":
          description: The editor is not an administrator
        "422":
          description: Own account, PENDING_VERIFICATION or unknown status
  /api/users/{id}/password:
    post:
      tags:
      - Users
      summary: Change the password of a user
      operationId: changePassword
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonChangePasswordRequest"
        required: true
      responses:
        "204":
          description: Password changed
        "400":
          description: Wrong current password
        "401":
          description: Missing or invalid token
        "403":
          description: Not the password of the signed-in user
        "422":
          description: New password too short
  /api/accounts:
    post:
      tags:
      - Accounts
      summary: Create the account of a customer and send them a verification link, valid for 1 hour
      description: "Public. The account waits for the verification of the email (status PENDING_VERIFICATION);
        the customer can already sign in and order."
      operationId: registerAccount
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonAccountRegistration"
        required: true
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonUser"
        "409":
          description: The email is already used
        "422":
          description: A required field is missing or the password has fewer than 8 characters
  /api/accounts/me:
    get:
      tags:
      - Accounts
      summary: Retrieve the account of the signed-in user, with their phone number and postal addresses
      operationId: getAccount
      security:
      - bearerAuth: []
      responses:
        "200":
          description: The account (never the password)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonAccount"
        "401":
          description: Not signed in
  /api/accounts/me/addresses:
    get:
      tags:
      - Accounts
      summary: Retrieve the postal addresses of the signed-in user, in their order
      operationId: getAddresses
      security:
      - bearerAuth: []
      responses:
        "200":
          description: The addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonPostalAddress"
  /api/accounts/me/addresses/{position}:
    put:
      tags:
      - Accounts
      summary: Change an address of the signed-in user (0 for the first one); the orders keep theirs
      operationId: changeAddress
      security:
      - bearerAuth: []
      parameters:
      - name: position
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonPostalAddress"
      responses:
        "200":
          description: The addresses, with the changed one at its place
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonPostalAddress"
        "400":
          description: Incomplete address
        "404":
          description: No address at this position
    delete:
      tags:
      - Accounts
      summary: Remove an address of the signed-in user (0 for the first one); the orders keep theirs
      operationId: removeAddress
      security:
      - bearerAuth: []
      parameters:
      - name: position
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: The remaining addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonPostalAddress"
        "404":
          description: No address at this position
  /api/accounts/email-verification:
    post:
      tags:
      - Accounts
      summary: Verify the email of an account with the token of the link sent by email
      description: "Public. The account becomes ACTIVE and the link cannot be used again."
      operationId: verifyEmail
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonEmailVerification"
        required: true
      responses:
        "204":
          description: Email verified
        "404":
          description: Unknown link, or link already used
        "410":
          description: Link older than 1 hour
  /api/accounts/me/verification-email:
    post:
      tags:
      - Accounts
      summary: Send a new verification link (valid for 1 hour) to the signed-in customer
      description: The previous links stop working
      operationId: sendVerificationEmail
      security:
      - bearerAuth: []
      responses:
        "204":
          description: Link sent
        "401":
          description: Not signed in
        "409":
          description: The email is already verified
  /api/password-reset-requests:
    post:
      tags:
      - Accounts
      summary: Send a link to choose a new password (valid for 1 hour) to the email, if it has an account
      description: "Public. The answer is the same whether the email has an account or not. A new link replaces the\
        \ previous one."
      operationId: requestPasswordReset
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonPasswordResetRequest"
        required: true
      responses:
        "204":
          description: Link sent if the email has an account
  /api/password-resets:
    post:
      tags:
      - Accounts
      summary: Choose a new password with the token of the link sent by email
      description: "Public. The link cannot be used again."
      operationId: resetPassword
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonChosenPassword"
        required: true
      responses:
        "204":
          description: Password changed
        "404":
          description: Unknown link, or link already used
        "410":
          description: Link older than 1 hour
        "422":
          description: Password shorter than 8 characters
  /api/users/login:
    post:
      tags:
      - Users
      summary: Authenticate a user
      description: Validates user credentials and returns user information on success
      operationId: loginUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonLoginRequest"
        required: true
      responses:
        "200":
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonLoginResponse"
        "401":
          description: Invalid credentials
        "403":
          description: "The account is SUSPENDED, LOCKED or DISABLED: { error, status }"
  /api/products:
    post:
      tags:
      - Products
      summary: Create a product
      operationId: create
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftJsonProduct"
        required: true
      responses:
        "201":
          description: Product created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonProduct"
  /api/cart/save:
    post:
      tags:
      - Cart
      summary: Add an item to the cart, or change the quantity of an item (0 removes it)
      description: "The cart of the signed-in customer (bearer token), otherwise the cart of the visitor
        given by X-Cart-Id; without X-Cart-Id, a visitor cart is created and its id is returned."
      operationId: addItem
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/CartId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonItem"
        required: true
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSaveItemResponse"
        "404":
          description: Unknown product
        "422":
          description: A new item needs a positive quantity
  /api/cart/merge:
    post:
      tags:
      - Cart
      summary: Merge the cart of the visitor (X-Cart-Id) into the cart of the signed-in customer
      description: "All the items are kept; for a product in both carts, the larger quantity is kept.
        The visitor cart is then deleted."
      operationId: mergeCarts
      security:
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/CartId"
      responses:
        "204":
          description: Merged
        "401":
          description: Not signed in
  /api/admin/products/sku-proposal:
    get:
      tags:
      - Administration
      summary: Propose a SKU free in the catalog, from the category and the name of a product (ADMIN role)
      description: "The first three letters of the category, the first two words of the name (eight characters at
        most each, without accents), then the first number from 0001 that no product has: CLO-ORGANIC-COTTON-0001"
      operationId: proposeSku
      security:
      - bearerAuth: []
      parameters:
      - name: category
        in: query
        required: true
        schema:
          type: string
      - name: name
        in: query
        required: false
        description: The name of the product in the default language (en), maybe not entered yet
        schema:
          type: string
      responses:
        "200":
          description: The SKU proposed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSkuProposal"
        "403":
          description: The signed-in user is not an administrator
  /api/admin/products/{id}:
    get:
      tags:
      - Administration
      summary: Retrieve a product with its translations in every language, to edit it
      operationId: getAdminProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The product with its translations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonAdminProduct"
        "404":
          description: Product not found
  /api/products/:
    get:
      tags:
      - Products
      summary: Retrieve all products
      description: Returns the full list of available products
      operationId: getProducts
      parameters:
      - name: Accept-Language
        in: header
        required: false
        description: The language of the customer (en, fr); the products not translated into it are in en
        schema:
          type: string
      responses:
        "200":
          description: Successfully retrieved the list of products
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonProduct"
  /api/products/{id}/reviews:
    get:
      tags:
      - Reviews
      summary: Retrieve the reviews of a product, newest first
      operationId: getReviews
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The reviews of the product
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonReview"
    post:
      tags:
      - Reviews
      summary: Review a product bought by the signed-in customer, once per product
      operationId: addReview
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonNewReview"
      responses:
        "201":
          description: The review written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonReview"
        "400":
          description: Invalid rating or comment
        "403":
          description: The customer did not buy (and pay for) the product
        "404":
          description: Product not found
        "409":
          description: The customer already reviewed the product
  /api/product-ratings:
    get:
      tags:
      - Reviews
      summary: Retrieve what the customers think of each product that has reviews
      operationId: getRatings
      responses:
        "200":
          description: The average rating and the number of reviews of each reviewed product
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonRatingSummary"
  /api/products/{id}:
    get:
      tags:
      - Products
      summary: Retrieve a product by ID
      operationId: getProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Accept-Language
        in: header
        required: false
        description: The language of the customer (en, fr); the products not translated into it are in en
        schema:
          type: string
      responses:
        "200":
          description: Successfully retrieved the product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonProduct"
        "404":
          description: Product not found
    put:
      tags:
      - Products
      summary: Edit a product (SKU, translations, category, price)
      description: Reserved to an administrator
      operationId: updateProduct
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditedJsonProduct"
        required: true
      responses:
        "200":
          description: The edited product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonProduct"
        "400":
          description: Malformed SKU
        "401":
          description: Not signed in
        "403":
          description: Not an administrator
        "404":
          description: Unknown product
        "409":
          description: SKU used by another product
  /api/cart/cart-items:
    get:
      tags:
      - Cart
      summary: Retrieve the items of the cart of the customer or of the visitor
      description: "The cart of the signed-in customer (bearer token), otherwise the cart of the visitor
        given by X-Cart-Id (empty without it)."
      operationId: getCartItems
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/CartId"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonCartItems"
  /api/orders/{id}/invoice:
    get:
      tags:
      - Invoices
      summary: Download the invoice of a paid order of the signed-in customer (PDF)
      operationId: getInvoice
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The invoice, saved as facture-<number of the order>.pdf
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Not signed in
        "404":
          description: No such order of the customer, or the order is not paid (no invoice)
  /api/admin/orders/{id}/invoice:
    get:
      tags:
      - Invoices
      summary: Download the invoice of any paid order (PDF, ADMIN role)
      operationId: getAnyInvoice
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The invoice
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          description: Not an administrator
        "404":
          description: No such order, or the order is not paid (no invoice)
  /api/admin/seller:
    get:
      tags:
      - Administration
      summary: Retrieve the seller written on the next invoices (ADMIN role)
      operationId: getSeller
      security:
      - bearerAuth: []
      responses:
        "200":
          description: The current seller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSeller"
        "403":
          description: Not an administrator
    put:
      tags:
      - Administration
      summary: Change the seller written on the next invoices; the invoices issued keep theirs (ADMIN role)
      operationId: updateSeller
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonSeller"
      responses:
        "200":
          description: The seller, now current
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSeller"
        "400":
          description: A name or an address missing, a SIRET or a VAT number malformed
        "403":
          description: Not an administrator
  /api/orders/discount-preview:
    get:
      tags:
      - Orders
      summary: Retrieve what a discount code takes off the cart of the signed-in customer
      operationId: previewDiscount
      security:
      - bearerAuth: []
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The amount the code takes off the items of the cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonDiscountPreview"
        "404":
          description: Unknown discount code
        "410":
          description: The discount code has expired, or is used up
  /api/admin/discount-codes:
    get:
      tags:
      - Administration
      summary: Retrieve the discount codes, newest first (ADMIN role)
      operationId: getDiscountCodes
      security:
      - bearerAuth: []
      responses:
        "200":
          description: The discount codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonDiscountCode"
    post:
      tags:
      - Administration
      summary: Give a discount code (ADMIN role)
      operationId: createDiscountCode
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonNewDiscountCode"
      responses:
        "201":
          description: The discount code given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonDiscountCode"
        "400":
          description: Invalid code, reduction or usage limit
        "409":
          description: The code is already given
  /api/admin/discount-codes/{code}:
    delete:
      tags:
      - Administration
      summary: Delete a discount code; the orders that used it keep their discount (ADMIN role)
      operationId: deleteDiscountCode
      security:
      - bearerAuth: []
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Unknown discount code
  /api/orders/shipping-options:
    get:
      tags:
      - Orders
      summary: Retrieve the shipping methods, with their cost for the cart of the signed-in customer
      operationId: getShippingOptions
      security:
      - bearerAuth: []
      responses:
        "200":
          description: The shipping methods and their cost
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonShippingOptions"
        "401":
          description: Not signed in
  /api/orders:
    post:
      tags:
      - Orders
      summary: Place an order from the cart of the signed-in customer; it awaits its payment
      description: >
        The order is delivered and billed to the given addresses (the delivery address when no billing address
        is given), which become addresses of the customer when they are new. The cart is kept until the order
        is paid (POST /api/orders/{id}/payment)
      operationId: placeOrder
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonOrderAddresses"
        required: true
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonOrder"
        "401":
          description: Not signed in
        "400":
          description: Incomplete delivery or billing address
        "409":
          description: Not enough units in stock for a product of the cart
        "403":
          description: "The account is SUSPENDED, LOCKED or DISABLED: { error, status }"
        "422":
          description: The cart is empty
    get:
      tags:
      - Orders
      summary: Retrieve the orders of the signed-in customer, newest first
      operationId: getOrders
      security:
      - bearerAuth: []
      responses:
        "200":
          description: The orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonOrder"
  /api/orders/{id}:
    get:
      tags:
      - Orders
      summary: Retrieve an order of the signed-in customer
      operationId: getOrder
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonOrder"
        "404":
          description: No order with this id for the signed-in customer
  /api/orders/{id}/payment:
    post:
      tags:
      - Payments
      summary: Start the payment of an order of the signed-in customer, then open its checkout page
      description: >
        With Stripe, the customer pays on the checkout page of Stripe, which confirms the payment later with its
        webhook (outcome PENDING). Without a Stripe key, the payment is simulated and confirmed at once (outcome
        PAID). Once paid, the cart is emptied and the order confirmed to the customer by email
      operationId: payOrder
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "201":
          description: The payment is started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonPaymentSession"
        "404":
          description: No order with this id for the signed-in customer
        "409":
          description: The order is already paid
  /api/payments/stripe/webhook:
    post:
      tags:
      - Payments
      summary: "Notification of Stripe: a checkout session is completed (called by Stripe, not by the front)"
      description: Authenticated by its Stripe-Signature header, verified with the secret of the webhook
      operationId: stripeNotification
      parameters:
      - name: Stripe-Signature
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Notification handled
        "400":
          description: Invalid signature
        "404":
          description: No Stripe key configured (simulated payments)
  /api/product-images:
    get:
      tags:
      - Product images
      summary: Retrieve the ids of the products that have an image
      operationId: getProductsWithImage
      responses:
        "200":
          description: The ids of the products with an image
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/products/{productId}/image:
    get:
      tags:
      - Product images
      summary: Retrieve the image of a product, in the small (cards, cart) or large (page) format
      description: A JPEG, with an ETag; the browser asks again with If-None-Match and gets 304 when unchanged
      operationId: getProductImage
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum: [small, large]
          default: large
      responses:
        "200":
          description: The image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The image did not change
        "404":
          description: The product has no image
  /api/admin/products/{productId}/image:
    put:
      tags:
      - Product images
      summary: Give the image of a product, 2 MB at most (JPEG, PNG or WebP), kept resized (ADMIN role)
      description: >
        The image is kept in two formats, as JPEG: LARGE (1600 px, 500 KB at most) for the page of the product,
        SMALL (400 px, 60 KB at most) for the cards of the catalog and the cart. It replaces the previous one
      operationId: addProductImage
      security:
      - bearerAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "204":
          description: The image is kept
        "403":
          description: The signed-in user is not an administrator
        "404":
          description: Unknown product
        "413":
          description: The image is larger than 2 MB
        "415":
          description: The file is not a JPEG, PNG or WebP image
    delete:
      tags:
      - Product images
      summary: Remove the image of a product (ADMIN role)
      operationId: removeProductImage
      security:
      - bearerAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The image is removed
        "404":
          description: The product has no image
  /api/stocks:
    get:
      tags:
      - Stocks
      summary: Retrieve the stocks of the products (a product without stock has none)
      operationId: getStocks
      responses:
        "200":
          description: The stocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonStock"
  /api/stocks/{productId}:
    get:
      tags:
      - Stocks
      summary: Retrieve the stock of a product (0 when it was never given)
      operationId: getStock
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The stock of the product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonStock"
  /api/admin/stocks/{productId}:
    put:
      tags:
      - Stocks
      summary: Give the number of units of a product that the shop has (ADMIN role)
      operationId: changeStock
      security:
      - bearerAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonStockQuantity"
      responses:
        "200":
          description: The new stock of the product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonStock"
        "400":
          description: Negative stock
        "403":
          description: The signed-in user is not an administrator
        "404":
          description: Unknown product
  /api/admin/orders:
    get:
      tags:
      - Administration
      summary: Retrieve the orders of all the customers, newest first, with their customer (ADMIN role)
      operationId: getAllOrders
      security:
      - bearerAuth: []
      responses:
        "200":
          description: The orders of all the customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonAdminOrder"
        "403":
          description: The signed-in user is not an administrator
  /api/admin/orders/{id}:
    get:
      tags:
      - Administration
      summary: Retrieve any order, with its customer (ADMIN role)
      operationId: getAnyOrder
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The order and its customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonAdminOrder"
        "403":
          description: The signed-in user is not an administrator
        "404":
          description: No order with this id
  /api/admin/orders/{id}/refund:
    post:
      tags:
      - Administration
      summary: Cancel a paid order before it is shipped, refund its payment and put its units back in stock (ADMIN role)
      description: "The order must be PAID or PROCESSING, and still have the status given; it becomes REFUNDED and its
        customer is told by email."
      operationId: refundOrder
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonOrderRefund"
      responses:
        "200":
          description: The order, refunded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonAdminOrder"
        "403":
          description: The signed-in user is not an administrator
        "404":
          description: No order with this id
        "409":
          description: The order no longer has the given status, or it cannot be refunded (not paid, or shipped)
        "502":
          description: The payment provider refused the refund; the order is unchanged
  /api/admin/orders/{id}/status/advance:
    post:
      tags:
      - Administration
      summary: Move an order to the next status of its life cycle, PROCESSING then SHIPPED then DELIVERED (ADMIN role)
      operationId: advanceOrderStatus
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonOrderStatusAdvance"
      responses:
        "200":
          description: The order at its next status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonAdminOrder"
        "403":
          description: The signed-in user is not an administrator
        "404":
          description: No order with this id
        "409":
          description: The order no longer has the given status, or it is delivered (no next status)
components:
  parameters:
    CartId:
      name: X-Cart-Id
      in: header
      required: false
      description: Id of the visitor cart (a UUID), returned by POST /api/cart/save
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    JsonSeller:
      type: object
      required:
        - name
        - address
        - siret
        - vatNumber
      properties:
        name:
          type: string
        address:
          type: string
          description: On one line
        siret:
          type: string
          description: 14 digits, spaces allowed
          example: 123 456 789 00012
        vatNumber:
          type: string
          description: Intra-community VAT number, the country then 2 to 13 digits or letters
          example: FR12345678901
    JsonUser:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, LOCKED, DISABLED]
    JsonLoginResponse:
      type: object
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          description: "JWT to send in the Authorization header: Bearer <token>"
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/JsonUser"
    JsonUserUpdate:
      type: object
      description: The fields an administrator can edit; the password is changed by a separate operation
      required:
        - firstName
        - lastName
        - email
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
          description: Role of the user (USER when absent)
    JsonUserCreate:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
          description: User's password (will be hashed by the server)
        role:
          type: string
          enum: [USER, ADMIN]
          description: Role of the new user (USER when absent)
    JsonAccountRegistration:
      type: object
      required: [firstName, lastName, email, password, phoneNumber, postalAddress]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
          description: At least 8 characters (will be hashed by the server)
        phoneNumber:
          type: string
        postalAddress:
          $ref: "#/components/schemas/JsonPostalAddress"
    JsonAccountStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, LOCKED, DISABLED]
    JsonEmailVerification:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token of the link (query parameter token of the verification page)
    JsonPasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: The email of the account whose password is forgotten
    JsonChosenPassword:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: The token of the link (query parameter token of the page to choose a new password)
        password:
          type: string
          description: The new password, 8 characters at least
    JsonPostalAddress:
      type: object
      description: >
        A postal address: its recipient, maybe someone else than the user, and where it is.
        The recipient is a person (PRIVATE_INDIVIDUAL, with firstName and lastName)
        or a company (LEGAL_ENTITY, with companyName and an optional vatNumber)
      required: [recipientType, street, postalCode, city, country]
      properties:
        recipientType:
          type: string
          enum: [PRIVATE_INDIVIDUAL, LEGAL_ENTITY]
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        companyName:
          type: string
          nullable: true
        vatNumber:
          type: string
          nullable: true
          description: The VAT identification number of the company (optional)
        street:
          type: string
        complement:
          type: string
          nullable: true
          description: Building, floor... (optional)
        postalCode:
          type: string
        city:
          type: string
        country:
          type: string
    JsonChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          description: New password, at least 8 characters (will be hashed by the server)
    JsonLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: User's email address
        password:
          type: string
          description: User's password (plain text)
    DraftJsonProduct:
      type: object
      required: [sku, category, price, currency, translations]
      properties:
        sku:
          type: string
          description: "Stock Keeping Unit, unique in the catalog: upper-case letters and digits in groups separated
            by hyphens, 32 characters at most (TSHIRT-ORGANIC-M); the spaces around are dropped, the letters put in
            upper case"
        category:
          type: string
        price:
          type: number
        currency:
          type: string
        translations:
          type: array
          description: The name and the description in each language of the product, the default one (en) required
          items:
            $ref: "#/components/schemas/JsonProductTranslation"
        vatRate:
          type: string
          enum: [STANDARD, INTERMEDIATE, REDUCED, SUPER_REDUCED]
          description: "The rate of VAT included in the price: 20, 10, 5.5 or 2.1 %. STANDARD when not given"
    EditedJsonProduct:
      type: object
      description: The fields an administrator edits; the id is given by the path
      required: [sku, category, price, currency, translations]
      properties:
        sku:
          type: string
          description: "Stock Keeping Unit, unique in the catalog: upper-case letters and digits in groups separated
            by hyphens, 32 characters at most (TSHIRT-ORGANIC-M); the spaces around are dropped, the letters put in
            upper case"
        category:
          type: string
        price:
          type: number
        currency:
          type: string
          description: Currency code (EUR)
        translations:
          type: array
          description: Every translation of the product, the default one (en) required; a translation not given is removed
          items:
            $ref: "#/components/schemas/JsonProductTranslation"
        vatRate:
          type: string
          enum: [STANDARD, INTERMEDIATE, REDUCED, SUPER_REDUCED]
          description: "The rate of VAT included in the price: 20, 10, 5.5 or 2.1 %. STANDARD when not given"
    JsonProduct:
      type: object
      required: [id, sku, name, description, category, price, currency]
      properties:
        id:
          type: string
        sku:
          type: string
          description: Stock Keeping Unit, unique in the catalog
        name:
          type: string
          description: In the language asked (Accept-Language), or in en when the product is not translated into it
        description:
          type: string
          description: In the language asked (Accept-Language), or in en when the product is not translated into it
        category:
          type: string
        price:
          type: number
        currency:
          type: string
    JsonAdminProduct:
      type: object
      description: A product as the administrator edits it, with its translations in every language
      required: [id, sku, category, price, currency, translations, vatRate]
      properties:
        id:
          type: string
        sku:
          type: string
          description: Stock Keeping Unit, unique in the catalog
        category:
          type: string
        price:
          type: number
        currency:
          type: string
        translations:
          type: array
          description: The name and the description in every language of the product, the default one (en) included
          items:
            $ref: "#/components/schemas/JsonProductTranslation"
        vatRate:
          type: string
          enum: [STANDARD, INTERMEDIATE, REDUCED, SUPER_REDUCED]
          description: "The rate of VAT included in the price: 20, 10, 5.5 or 2.1 %"
    JsonSkuProposal:
      type: object
      required: [sku]
      properties:
        sku:
          type: string
    JsonProductTranslation:
      type: object
      required: [language, name, description]
      properties:
        language:
          type: string
          description: en or fr
        name:
          type: string
        description:
          type: string
    JsonItem:
      type: object
      properties:
        itemId:
          type: string
        productId:
          type: string
        productName:
          type: string
        productDescription:
          type: string
        productCategory:
          type: string
        productPrice:
          type: number
        productCurrency:
          type: string
        productQuantity:
          type: integer
          format: int32
    JsonCartItem:
      type: object
      properties:
        itemId:
          type: string
        productId:
          type: string
        productName:
          type: string
        productDescription:
          type: string
        productCategory:
          type: string
        productPrice:
          type: number
        productCurrency:
          type: string
        productQuantity:
          type: integer
          format: int32
        itemPrice:
          type: number
    JsonOrderRefund:
      type: object
      required: [currentStatus]
      properties:
        currentStatus:
          type: string
          description: The status of the order as the administrator sees it (PAID or PROCESSING)
    JsonAdminOrder:
      description: An order as the administrators see it, with the customer who placed it
      allOf:
      - $ref: "#/components/schemas/JsonOrder"
      - type: object
        required: [customer, statusHistory]
        properties:
          customer:
            $ref: "#/components/schemas/JsonOrderCustomer"
          statusHistory:
            type: array
            description: The statuses the order went through, oldest first (the first one, when it was placed)
            items:
              $ref: "#/components/schemas/JsonOrderStatusChange"
    JsonOrderStatusChange:
      type: object
      required: [status, changedAt]
      properties:
        status:
          type: string
          enum: [AWAITING_PAYMENT, PAID, PROCESSING, SHIPPED, DELIVERED, CANCELLED, REFUNDED]
        changedAt:
          type: string
          format: date-time
    JsonOrderCustomer:
      type: object
      description: The customer who placed an order; empty fields when their account cannot be read any more
      required: [firstName, lastName, email]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
    JsonOrder:
      type: object
      required: [id, placedAt, status, lines, itemsPrice, shippingMethod, shippingCost, discountAmount, totalPrice,
        currency, deliveryAddress, billingAddress]
      properties:
        id:
          type: string
        placedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [AWAITING_PAYMENT, PAID, PROCESSING, SHIPPED, DELIVERED, CANCELLED, REFUNDED]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/JsonOrderLine"
        itemsPrice:
          type: number
          description: The price of the lines, without the shipping
        shippingMethod:
          type: string
          enum: [STANDARD, EXPRESS]
        shippingCost:
          type: number
          description: 0 when the shipping is free
        discountCode:
          type: string
          nullable: true
          description: The discount code used, if any
        discountAmount:
          type: number
          description: What the discount code took off the items (0 without code)
        totalPrice:
          type: number
          description: The price of the lines, less the discount, plus the shipping
        currency:
          type: string
        deliveryAddress:
          $ref: "#/components/schemas/JsonPostalAddress"
        billingAddress:
          $ref: "#/components/schemas/JsonPostalAddress"
        paymentDeadline:
          type: string
          format: date-time
          nullable: true
          description: When the order must be paid by, or it is cancelled. Only for the customer, while the order awaits its payment
    JsonPaymentSession:
      type: object
      required: [checkoutUrl, outcome]
      properties:
        checkoutUrl:
          type: string
          description: The page where the customer pays the order
        outcome:
          type: string
          enum: [PENDING, PAID]
          description: PAID when the payment is already confirmed (simulated payment)
    JsonStock:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          description: The number of units that the shop has
    JsonStockQuantity:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0
    JsonOrderStatusAdvance:
      type: object
      description: The status of the order when the administrator asks to move it to the next one
      required: [currentStatus]
      properties:
        currentStatus:
          type: string
          enum: [AWAITING_PAYMENT, PAID, PROCESSING, SHIPPED, DELIVERED, CANCELLED, REFUNDED]
    JsonOrderAddresses:
      type: object
      required: [deliveryAddress]
      properties:
        deliveryAddress:
          $ref: "#/components/schemas/JsonPostalAddress"
        billingAddress:
          $ref: "#/components/schemas/JsonPostalAddress"
        shippingMethod:
          type: string
          enum: [STANDARD, EXPRESS]
          description: STANDARD when not given
        discountCode:
          type: string
          description: The discount code entered, if any (404 when unknown, 410 when expired or used up)
    JsonDiscountPreview:
      type: object
      required: [code, amountOff, currency]
      properties:
        code:
          type: string
        amountOff:
          type: number
        currency:
          type: string
    JsonReview:
      type: object
      required: [id, productId, reviewerName, rating, comment, reviewedAt]
      properties:
        id:
          type: string
        productId:
          type: string
        reviewerName:
          type: string
          description: The first name and the initial of the last name of the customer (Marie D.)
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        reviewedAt:
          type: string
          format: date-time
    JsonNewReview:
      type: object
      required: [rating, comment]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
    JsonRatingSummary:
      type: object
      required: [productId, average, reviewCount]
      properties:
        productId:
          type: string
        average:
          type: number
          description: The average of the ratings, from 1 to 5, with one decimal
        reviewCount:
          type: integer
    JsonDiscountCode:
      type: object
      required: [code, reductionType, reductionValue, expiresAt, usageLimit, timesUsed]
      properties:
        code:
          type: string
        reductionType:
          type: string
          enum: [PERCENTAGE, AMOUNT]
        reductionValue:
          type: number
          description: A percentage from 1 to 100, or an amount in euros
        expiresAt:
          type: string
          format: date-time
        usageLimit:
          type: integer
        timesUsed:
          type: integer
    JsonNewDiscountCode:
      type: object
      required: [code, reductionType, reductionValue, expiresAt, usageLimit]
      properties:
        code:
          type: string
          description: Upper-case letters and digits, 3 to 30 (put in upper case)
        reductionType:
          type: string
          enum: [PERCENTAGE, AMOUNT]
        reductionValue:
          type: number
        expiresAt:
          type: string
          format: date-time
        usageLimit:
          type: integer
          description: 1 or more
    JsonShippingOptions:
      type: object
      required: [options, freeShippingThreshold, currency]
      properties:
        options:
          type: array
          items:
            $ref: "#/components/schemas/JsonShippingOption"
        freeShippingThreshold:
          type: number
          description: The price of the items from which the standard shipping is free (0 - always free)
        currency:
          type: string
    JsonShippingOption:
      type: object
      required: [method, cost]
      properties:
        method:
          type: string
          enum: [STANDARD, EXPRESS]
        cost:
          type: number
          description: For the items of the cart; 0 when free
    JsonAccount:
      type: object
      required: [id, firstName, lastName, email, role, status, postalAddresses]
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, LOCKED, DISABLED]
        phoneNumber:
          type: string
          nullable: true
        postalAddresses:
          type: array
          items:
            $ref: "#/components/schemas/JsonPostalAddress"
    JsonOrderLine:
      type: object
      required: [productId, productName, unitPrice, quantity, linePrice]
      properties:
        productId:
          type: string
        productName:
          type: string
        unitPrice:
          type: number
        quantity:
          type: integer
        linePrice:
          type: number
    JsonSaveItemResponse:
      type: object
      properties:
        status:
          type: string
        cartId:
          type: string
          nullable: true
          description: Id of the visitor cart, to send in X-Cart-Id; null for a signed-in customer
    JsonCartItems:
      type: object
      properties:
        items:
          type: array
