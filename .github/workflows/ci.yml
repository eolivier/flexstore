name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Base PostgreSQL utilisée par les tests d'intégration (cf. application-test.yml)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flexstore
          POSTGRES_USER: flex
          POSTGRES_PASSWORD: flex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flex -d flexstore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: backend
        run: ./gradlew test

      - name: Integration tests
        working-directory: backend
        run: ./gradlew integrationTest

  front:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      - name: Install deps
        working-directory: front
        run: npm ci

      - name: Build
        working-directory: front
        run: npm run build

      - name: Tests
        working-directory: front
        run: npm test
