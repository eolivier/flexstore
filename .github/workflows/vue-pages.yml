# DISABLED: the shop is deployed on the VPS (https://flexstore.tech, see deploy.yml), no longer on Cloudflare Pages.
# The workflow is kept for reference: it only starts by hand, and its job is skipped (remove `if: false` to use it).
name: Deploy Vue front to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  build-deploy:
    if: false
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
    permissions:
      contents: read
      deployments: write  # pour créer une entrée Deployments (optionnel)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: front/.nvmrc
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      - name: Upgrade npm
        run: npm install -g npm@12.2.2

      - name: Clean npm cache
        working-directory: front
        run: npm cache clean --force

      - name: Install deps
        working-directory: front
        run: npm ci

      - name: Build
        working-directory: front
        run: npm run build

      # Publie le dossier 'front/dist' sur Cloudflare Pages
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_FLEXSTORE_VUE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy front/dist --project-name=flexstore-front
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}  # seulement si tu veux une entrée Deployments
